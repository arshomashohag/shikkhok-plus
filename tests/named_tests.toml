# ---------------------------------------------------------------------------
# D1 `signing-up-and-joining`. Seven entries, and the reason they are named
# rather than left to a coverage number is sharper here than anywhere else in
# this manifest: the authorization layer is measured as BRANCH coverage, and
# every one of these predicates is a branch that several other tests already
# execute incidentally. Deleting any of these tests would not move a number.
# ---------------------------------------------------------------------------

[[test]]
id = "test_links_that_only_name_an_account_grant_no_role_lens"
file = "tests/authz/test_acceptance_predicate.py"
criterion = "An account named on BOTH links of a pending seat resolves neither a student nor a guardian lens; this failed against the merged _LENS_QUERY, which granted on the link alone"
rule = "BR1.1"

[[test]]
id = "test_the_summary_counts_agree_with_the_grant"
file = "tests/authz/test_acceptance_predicate.py"
criterion = "lens_summary reports zero student seats and zero guardian children for the same unaccepted links; a separate statement in a separate module, so fixing the resolver alone is a silent half-fix"
rule = "BR1.2"

[[test]]
id = "test_one_account_on_both_links_decides_once_for_both"
file = "tests/authz/test_decision_transitions.py"
criterion = "One accept moves BOTH columns when one account holds both links, and only its own when the links name different people; BR5.2 and BR5.3 read as a contradiction and an implementation satisfying either alone fails half this file"
rule = "BR5.3"

[[test]]
id = "test_no_decision_service_resets_a_link_to_pending"
file = "tests/authz/test_decision_transitions.py"
criterion = "Every D1 write path exercised against a declined link leaves it declined or accepted, never pending; the absence BR5.4's durability depends on, which no diff shows"
rule = "BR6.1"

[[test]]
id = "test_pending_and_declined_links_grant_an_invitation_lens"
file = "tests/authz/test_invitation_lens.py"
criterion = "A pending AND a declined seat both resolve invitation lenses, returned as a SET across two batches; restricting the grant to pending would make BR5.4's reversal unreachable"
rule = "BR1.3"

[[test]]
id = "test_a_seat_stays_removable_after_the_named_person_signs_up"
file = "tests/batches/test_removability_after_signup.py"
criterion = "A teacher removes a seat whose named person has signed up and accepted nothing; this failed against merged code and is the mistyped-number recovery path the unit exists to open"
rule = "BR7.1"

[[test]]
id = "test_the_roster_shows_an_accepted_seat_as_claimed"
file = "tests/batches/test_removability_after_signup.py"
criterion = "A seat whose GUARDIAN link accepted while the student link is pending reads as claimed; an implementation reading only student_decision passes every other test in that file"
rule = "BR7.2"

[[test]]
id = "test_reading_a_seat_removed_mid_request_raises_rather_than_rendering"
file = "tests/authz/test_invitation_lens.py"
criterion = "A seat removed between resolving the lens and reading it raises rather than returning a blank invitation; a teacher may legitimately remove an unaccepted seat, so the window is real"
rule = "BR7.1"

[[test]]
id = "test_signing_up_leaves_an_existing_seat_pending"
file = "tests/accounts/test_lookup.py"
criterion = "After signup links the account to an existing seat, BOTH decision columns are still pending and the guardian link names the new account; the single most important ABSENCE in this unit, which no diff shows"
rule = "BR5.1"

# ---------------------------------------------------------------------
# D2 `running-a-batch`. Three obligations, and the third is the one that
# must not become a review note: no server-side control can observe it.
# ---------------------------------------------------------------------

[[test]]
id = "test_one_accepted_link_makes_the_seat_accepted"
file = "tests/batches/test_accepted_count.py"
criterion = "A split seat — student accepted, guardian declined — counts as accepted; an implementation requiring BOTH links, or reading only student_decision, gets a different answer here and the same answer everywhere else"
rule = "BR1.2"

[[test]]
id = "test_the_denominator_includes_declined_seats"
file = "tests/batches/test_accepted_count.py"
criterion = "Nine accepted of twelve where one of the three others DECLINED; an implementation filtering declined seats from the total reports nine of eleven, and the teacher cannot tell a decline from a removal"
rule = "BR1.4"

[[test]]
id = "test_the_two_refusals_carry_different_codes_and_message_keys"
file = "tests/batches/test_removal_refusals.py"
criterion = "Claimed and erased differ on BOTH halves a screen reads — the code it switches on and the message key it renders; a pair agreeing on either collapses two remedies into one screen and leaves a teacher trying the one that cannot work"
rule = "BR3.2"

[[test]]
id = "test_removability_agrees_with_what_removal_actually_does"
file = "tests/batches/test_roster_states.py"
criterion = "The row's is_removable equals whether remove_enrollment actually succeeds, across claimed, erased and removable seats; the erased seat's two decisions both read pending, so every client-side derivation would offer an action the server then refuses"
rule = "BR3.1"

[[test]]
id = "test_a_recorded_guardian_who_has_not_answered_is_pending_not_absent"
file = "tests/batches/test_roster_states.py"
criterion = "A guardian the teacher recorded who has not signed up yet reads pending, not absent; keying absence on guardian_account_id rather than the typed number would drop every unregistered guardian out of the outstanding figure"
rule = "BR2.2"

[[test]]
id = "BACK AFTER A CHILD SWITCH does not reach the previous child"
file = "android/src/test/kotlin/com/shikkhokplus/app/feature/guardian/GuardianHomeScreenTest.kt"
criterion = "After switching child and then pressing Back, the previous child is still not the one displayed; no server-side control can observe this failure because both requests are legitimately authorized and neither response is anomalous, so this test is the only mechanism"
rule = "BR4.2"

# ---------------------------------------------------------------------
# D3 `collecting-fees`. The RED-first obligations, each named with the
# WRONG implementation it separates from the right one.
#
# Nearly every rule in this unit met the test-first predicate -- the
# correct output is knowable from the requirement, and a wrong answer
# is a money or an authorization error -- which is unusual and is the
# point of the unit.
# ---------------------------------------------------------------------

[[test]]
id = "test_the_clamp_does_not_degrade_the_anchor"
file = "tests/fees/test_periods.py"
criterion = "Anchor 31 gives 2027-01-31, 2027-02-28, 2027-03-31 and 2028-02-29; the THIRD value separates the designs, because a degrading clamp rewrites the anchor to 28 in February and returns the 28th for ever after"
rule = "BR2.2"

[[test]]
id = "test_a_null_anchor_means_the_last_day_of_the_period"
file = "tests/fees/test_periods.py"
criterion = "A NULL fee_due_day yields the month's last day, the only default that cannot make a fee due before the month it pays for has been taught"
rule = "BR2.3"

[[test]]
id = "test_zero_is_a_real_fee_and_not_a_missing_one"
file = "tests/fees/test_resolution.py"
criterion = "An enrollment fee of 0.00 on a batch defaulting to 1000.00 charges 0.00; `enrollment.fee_amount or batch.default_fee` is the idiomatic line and it bills a student the teacher deliberately excused"
rule = "BR2.4"

[[test]]
id = "test_both_null_refuses_rather_than_charging_zero"
file = "tests/fees/test_resolution.py"
criterion = "Neither fee set refuses; a 0.00 charge would be indistinguishable from a waiver once it is on the append-only ledger"
rule = "BR2.4"

[[test]]
id = "test_a_zero_seat_fee_charges_zero_not_the_batch_default"
file = "tests/fees/test_generation.py"
criterion = "The falsiness defect end to end rather than only in the pure resolver, because the generation path is where it would actually bill somebody"
rule = "BR2.4"

[[test]]
id = "test_overlapping_generations_leave_exactly_one_cycle_per_period"
file = "tests/fees/test_generation_races.py"
criterion = "Eight threads released from a barrier against real PostgreSQL leave one row per (enrollment_id, period) and one period's charge; a SEQUENTIAL version passes against an implementation with no atomicity at all, which is the implementation the constraint exists to prevent"
rule = "BR1.3"

[[test]]
id = "test_overlapping_generations_over_several_periods_each_charge_once"
file = "tests/fees/test_generation_races.py"
criterion = "Three periods racing at once each charge once; a per-period lock that happened to work for one period can still double-charge when several insert in one run"
rule = "BR1.3"

[[test]]
id = "test_a_later_rerun_on_a_new_day_appends_nothing"
file = "tests/fees/test_generation_across_days.py"
criterion = "Day N, then N+1, then N+1 again leave an identical row set and ledger total; racing threads cannot reach this because they all carry the same clock, which is why it is a separate test and the forgettable one"
rule = "BR1.4"

[[test]]
id = "test_a_missed_day_is_caught_up_by_the_next_run"
file = "tests/fees/test_generation_across_days.py"
criterion = "A job that did not run in December or January fills both holes in February; a hole nothing ever fills is the failure the inclusive period range prevents"
rule = "BR1.4"

[[test]]
id = "test_the_containing_period_is_charged_in_full_not_prorated"
file = "tests/fees/test_inactive_from.py"
criterion = "A seat inactive from the 15th of a 28-day month is charged the whole fee; the rule is named in the affirmed posture as one that fails quietly"
rule = "BR1.5"

[[test]]
id = "test_an_existing_due_stands_after_the_seat_goes_inactive"
file = "tests/fees/test_inactive_from.py"
criterion = "Going inactive stops FUTURE cycles and clears nothing; D5's cross-batch dues query is driven by outstanding balance rather than active status, so a clearing implementation would silently empty that view"
rule = "BR1.5"

[[test]]
id = "test_a_declined_guardian_link_does_not_stop_generation"
file = "tests/fees/test_decline_semantics.py"
criterion = "A declined guardian link generates the next period unchanged; if a guardian's refusal stopped generation, any student could clear their own fees by having a guardian refuse"
rule = "BR1.7"

[[test]]
id = "test_a_declined_guardian_link_writes_no_reversal"
file = "tests/fees/test_decline_semantics.py"
criterion = "The student's obligation stands in full after a guardian decline; this is the half of the asymmetry that already produced one defect in this project on the presentation side, where a guardian was told the fee stopped and it had not"
rule = "BR1.7"

[[test]]
id = "test_a_declined_student_link_voids_the_accrued_balance_by_reversal"
file = "tests/fees/test_decline_semantics.py"
criterion = "Outstanding reaches 0.00 AND the original charge row still exists; deleting the charge would also give zero while destroying the audit trail FR9.2 requires, so both halves are asserted"
rule = "BR1.6"

[[test]]
id = "test_voiding_a_partly_paid_cycle_forgives_only_the_remainder"
file = "tests/fees/test_decline_semantics.py"
criterion = "A seat charged 1500 with 500 received is forgiven 1000, not 1500; forgiving the charge would record a relief that never happened"
rule = "BR1.6"

[[test]]
id = "test_un_declining_resumes_without_resurrecting_voided_cycles"
file = "tests/fees/test_decline_semantics.py"
criterion = "After decline, void and re-accept, the voided period stays at 0.00 and only later periods carry a charge; retroactively re-billing months somebody was not participating in punishes correcting a mistake"
rule = "BR1.8"

[[test]]
id = "test_a_pending_seat_generates"
file = "tests/fees/test_decline_semantics.py"
criterion = "A seat with both decisions pending generates; pending is the normal state of a new seat, and withholding generation would make the product useless for the one task it exists for"
rule = "BR1.9"

[[test]]
id = "test_carrying_1000_into_a_second_1000_charge_reads_2000_not_3000"
file = "tests/fees/test_carry.py"
criterion = "The figure team memory warns about: two-sided gives 2000.00 and one-sided gives 3000.00, with the gap growing every period. An earlier form of this rule paired 2500 against a true 1500, which reproduces under no implementation"
rule = "BR3.1"

[[test]]
id = "test_the_two_sides_of_every_carry_sum_equal"
file = "tests/fees/test_carry.py"
criterion = "sum(carry_forward) == sum(carried_out) at the enrollment level, which catches a one-sided carry immediately and is a transaction property the fold cannot enforce"
rule = "BR3.1"

[[test]]
id = "test_a_carry_exceeding_the_origins_balance_is_refused"
file = "tests/fees/test_carry.py"
criterion = "Carrying 1200 out of a period owing 1000 raises; the receiver would be charged in full while the origin is relieved only to its floor, so the surplus appears from nowhere"
rule = "BR3.2"

[[test]]
id = "test_credit_granted_in_one_period_is_spent_in_another"
file = "tests/fees/test_credit.py"
criterion = "200.00 credit against a 1000.00 charge leaves 800.00 -- the figure ADR-002's first correction attempt computed as 1000, because its per-cycle form was missing the credit_applied term. Credit trapped in a closed period would make an overpayment vanish"
rule = "BR4.1"

[[test]]
id = "test_credit_exceeding_the_charge_applies_only_what_is_owed"
file = "tests/fees/test_credit.py"
criterion = "1500.00 held against a 1000.00 charge applies 1000.00 and leaves 500.00; applying the whole credit would drive the balance negative, which the invariant forbids"
rule = "BR4.4"

[[test]]
id = "test_generation_applies_available_credit_in_the_same_transaction"
file = "tests/fees/test_credit.py"
criterion = "The charge is appended BEFORE the application, asserted on the entry order; reversed, the computation is min(available, 0) and the credit is never spent at all"
rule = "BR4.5"

[[test]]
id = "test_over_approval_records_a_receipt_and_a_credit_grant"
file = "tests/fees/test_verification.py"
criterion = "A 1000 charge approved at 1200 gives outstanding 0.00 and credit 200.00; cash in is receipt PLUS credit_grant, which is exactly where ADR-002's first correction attempt failed"
rule = "BR4.2"

[[test]]
id = "test_a_claim_resolves_to_the_oldest_unpaid_cycle"
file = "tests/fees/test_claims.py"
criterion = "With two unpaid cycles the stored period is the earlier one, resolved once at submission so the claimant and the teacher look at the same cycle"
rule = "BR5.1"

[[test]]
id = "test_a_claim_with_no_open_cycle_is_refused_and_creates_none"
file = "tests/fees/test_claims.py"
criterion = "No cycle row is created to receive the payment; creating one would bill the student for a period that had not begun"
rule = "BR5.1"

[[test]]
id = "test_an_over_claim_is_accepted_as_pending"
file = "tests/fees/test_claims.py"
criterion = "5000 against a 1000 balance is recorded; blocking an over-claim at submission makes a genuine out-of-band overpayment unreportable, leaving a phone call as the only route"
rule = "BR5.2"

[[test]]
id = "test_the_shortfall_is_charged_minus_approved_not_claimed_minus_approved"
file = "tests/fees/test_verification.py"
criterion = "1000 charged, 1500 claimed, approved at 600 gives 400.00 and not 900.00. A claim equal to the charge cannot separate the two formulas, which is why this case uses one where they differ; measuring against the claim would let a payer change what they owe by changing what they assert"
