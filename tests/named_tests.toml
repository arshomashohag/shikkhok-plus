[[test]]
id = "test_negative_magnitude_then_sign"
file = "tests/money/test_arithmetic.py"
criterion = "-0.05 into 3 gives EXACTLY [-0.02, -0.02, -0.01] in order; both candidate implementations sum correctly, so asserting the sum alone certifies nothing"
