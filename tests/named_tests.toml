# The named-test manifest.
#
# 100% branch coverage says the branches executed. It cannot say the RIGHT
# TESTS EXIST — a missing named test whose branches another test already
# covers is invisible to it. The multi-period carry test is the worked
# example: its branches are all exercised by the single-carry test, so
# deleting it would not move the coverage number at all.
#
# Every entry carries its ACCEPTANCE CRITERION, not just a name. A manifest
# can verify that a test exists and runs; it cannot verify that the test
# asserts anything worthwhile. Naming the criterion is what makes a
# trivially-asserting test visible to a reader as a mismatch — no mechanism
# detects that automatically, and `team.md` already rejects always-passing
# tests in review.
#
# test_named_test_manifest.py asserts every entry below resolves to a test
# that exists and runs.

[[test]]
id = "test_float_construction_refused"
file = "tests/money/test_construction.py"
criterion = "Money(0.1) raises; the refusal is on the TYPE, not the value"
rule = "BR1.1"

[[test]]
id = "test_integral_float_also_refused"
file = "tests/money/test_construction.py"
criterion = "Money(1000.0) is refused identically to Money(0.1), so the rule is not value-dependent"
rule = "BR1.1"

[[test]]
id = "test_equal_values_hash_equally"
file = "tests/money/test_construction.py"
criterion = "Money('1.5') and Money('1.50') are equal AND hash equally, so a set holds one"
rule = "BR1.3"

[[test]]
id = "test_eleven_integer_digits_refused"
file = "tests/money/test_construction.py"
criterion = "10000000000.00 raises; the value is rejected, never truncated"
rule = "BR1.7"

[[test]]
id = "test_rounds_half_up_not_banker"
