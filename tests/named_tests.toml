criterion = "Serializing a negative raises; the canonical pattern admits no sign"
rule = "BR5.7"

[[test]]
id = "test_fixture_is_refused"
file = "tests/gates/test_import_gates.py"
criterion = "Gate 1 fires on a module importing persistence into app/money"
rule = "NFR9.6"

[[test]]
id = "test_fixture_is_refused_by_the_real_linter"
file = "tests/gates/test_import_gates.py"
criterion = "Gate 2 fires when the project's ACTUAL Ruff config runs against a raw-decimal import"
rule = "NFR9.6"

[[test]]
id = "test_config_resolves_to_a_real_package"
file = "tests/gates/test_import_gates.py"
criterion = "Gate 1's walked path is a real non-empty package, so a rename cannot leave it passing vacuously"
rule = "NFR9.29"

[[test]]
id = "test_config_scope_is_exactly_the_money_module"
file = "tests/gates/test_import_gates.py"
criterion = "Gate 2's exception resolves to exactly app/money/**, never a parent"
