[[test]]
id = "test_a_shortfall_with_no_disposition_is_refused"
file = "tests/fees/test_verification.py"
criterion = "An approval below the charge with no disposition raises and leaves the claim pending; a default would silently choose for the teacher, and carried and waived have opposite consequences for the student"
