criterion = "A negative ledger entry amount raises; the sign belongs to the kind"
rule = "BR4.1"

[[test]]
id = "test_scenario_s1_paid_in_full"
file = "tests/money/test_ledger.py"
criterion = "A charge fully matched by a receipt leaves outstanding 0.00 and credit 0.00, with the identity balancing"
