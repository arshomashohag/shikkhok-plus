# Alembic configuration.
#
# The URL is deliberately absent: it comes from SHIKKHOKPLUS_DATABASE_URL at
# runtime, read in migrations/env.py. A URL here would be a credential in the
# repository [project.md Forbidden], and it would also make the test container
# -- whose URL is assigned per run -- unreachable.
#
# Migrations run as a DISTINCT, LOGGED STEP before the new container serves
# traffic, never as a side effect of application start [team.md Deployment].

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
