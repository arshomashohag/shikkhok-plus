# Gradle and Android build properties.
#
# Created at B3, when Compose arrived and AndroidX became a hard
# requirement. Every value here is a build-level decision rather than a
# preference, so each one says why.

# AndroidX is mandatory for Compose, activity-compose and lifecycle.
# The legacy support library is unmaintained and cannot be mixed.
android.useAndroidX=true

# A 2 GB Lightsail host is the deployment target, but the BUILD runs on a
# developer machine; this bounds the daemon so a Gradle build does not
# starve the backend test container sharing the same laptop.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build only the variants actually requested. On a two-surface solo
# project the wasted configuration time is otherwise paid on every run.
org.gradle.configureondemand=true

# Parallel execution across projects. There is one Android module today,
# so this is close to free now and correct once there are more.
org.gradle.parallel=true

# Kotlin incremental compilation, which is the single largest lever on
# the edit-test loop for the surface with the least experienced reviewer.
kotlin.incremental=true

# NOT set, deliberately:
#
#   android.enableJetifier — it rewrites legacy support-library artifacts
#   into AndroidX at build time. We have no such dependency and do not
#   want one arriving silently; leaving Jetifier off means a support-
#   library transitive FAILS the build rather than being quietly
#   translated. Given the forbidden-identifier rules, an unexamined
#   legacy dependency is exactly what must not slip in.
