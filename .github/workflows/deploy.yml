name: deploy

# **One pipeline: infrastructure and application, per environment.**
#
# The split into terraform.yml and deploy-staging.yml meant a deploy
# needed two dispatches in the right order, and the ordering was
# invisible until something failed with a message about a missing
# repository. One workflow, one dispatch, one environment choice.
#
# **Terraform runs on every deploy.** An earlier version tried to skip
# it when no file under infra/ had changed, which was a worse
# reimplementation of what `terraform plan` already does: a path
# comparison sees a file, not the world. Someone changing a security
# group in the console, or an AMI data source resolving a newer image,
# is drift that a path check calls "unchanged" and a plan catches.
#
# So the apply always runs and Terraform decides whether anything
# needs doing. A no-op apply costs about thirty seconds.
#
# **The ASG refreshes on every deploy**, replacing the instance so it
# re-runs user_data: pull the image, migrate, serve. That is only safe
# because the database is RDS -- a containerised Postgres lived on a
# root volume with delete_on_termination = true, so this design would
# have wiped the database on every run.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment"
        required: true
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: "Branch or tag to deploy"
        required: false
        type: string
      # `skip_migrations` was removed on 2026-10-25. It was declared here
      # and referenced nowhere else in this file -- no `if:`, no
      # expression -- so it skipped nothing in either position while
      # reading as a deliberate control. Migrations run in
      # `user_data.sh.tftpl` as a distinct logged step that fails closed,
      # and this workflow has no Alembic step to skip.
      #
      # Removed rather than wired up: an input that suppressed the boot
      # migration would let an instance serve against a schema it was not
      # built for, which is the failure that step exits non-zero to
      # prevent.

permissions:
  contents: read
  id-token: write

concurrency:
  # Per environment, so a staging deploy never queues behind a
  # production one. Never cancelled mid-run: an interrupted apply
  # leaves a held lock and a half-applied change.
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------
  # 1. Is this environment configured, and where does the image go?
  # ---------------------------------------------------------------
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    outputs:
      repository: ${{ steps.resolve.outputs.repository }}
      asg: ${{ steps.resolve.outputs.asg }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      # **The commit being deployed is the one CHECKED OUT, not
      # `github.sha`.** `github.sha` is the commit the workflow was
      # dispatched FROM -- main's head, usually -- while `inputs.ref`
      # selects what is built. Tagging by `github.sha` meant a rollback
      # to an older ref either redeployed main's image (the tag already
      # existed, so the build was skipped) or pushed the old code under
      # main's SHA, permanently, into an IMMUTABLE repository [OPS-9].
      #
      # Resolved ONCE, here, and every later job checks out this exact
      # SHA rather than re-resolving the ref: a branch that moves
      # between jobs would otherwise apply one commit's Terraform and
      # ship another commit's image.
      - name: Resolve the commit
        id: commit
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      # **The release gate's CVE check: production only, and BLOCKING**
      # [OPS-19]. The per-push scan in check.yml annotates at every
      # severity and never blocks -- the affirmed two-speed model -- and
      # until 2026-11-02 nothing read its results at release, so the
      # blocking half did not exist. Here, before infrastructure or the
      # image changes, each Critical or High finding in the commit being
      # deployed fails the run unless .security-exceptions.md carries an
      # unexpired entry for it; an expired entry fails it on its own; a
      # finding whose severity cannot be looked up counts as High.
      #
      # Staging is not gated: it is where a fix is rehearsed, and
      # blocking it would block the fix.
      - uses: actions/setup-python@v7
        if: inputs.environment == 'production'
        with:
          python-version: "3.12"

      - name: Release gate - dependency CVEs
        if: inputs.environment == 'production'
        run: |
          python -m pip install --require-hashes -r requirements.txt
          # pip-audit exits non-zero when it finds anything; the gate
          # below makes the decision, so its exit code is not the
          # verdict -- but a missing report is.
          pip-audit --requirement requirements.txt --format json \
            --output audit.json --progress-spinner off || true
          if [ ! -s audit.json ]; then
            echo "::error::pip-audit produced no report; the gate cannot decide."
            exit 1
          fi
          python3 deploy/cve_gate.py audit.json .security-exceptions.md

      - name: Fail early when the environment is not configured
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          INFRA_ROLE: ${{ vars.AWS_ROLE_ARN }}
          BUCKET: ${{ vars.TF_STATE_BUCKET }}
          APEX: ${{ vars.APEX_DOMAIN }}
          OTP_HMAC_KEY: ${{ secrets.SHIKKHOKPLUS_OTP_HMAC_KEY }}
          JWT_KEYS: ${{ secrets.SHIKKHOKPLUS_JWT_KEYS }}
          PLATFORM_ADMIN_PHONES: ${{ secrets.SHIKKHOKPLUS_PLATFORM_ADMIN_PHONES }}
          MFA_KEYS: ${{ secrets.SHIKKHOKPLUS_MFA_KEYS }}
          ADMIN_ALLOWED_CIDRS: ${{ secrets.SHIKKHOKPLUS_ADMIN_ALLOWED_CIDRS }}
        run: |
          # **Administrators named without the locks that make the admin
          # surface usable.** A production process refuses to start with
          # admin phones set and no MFA keyring or no admin networks
          # (app/config.py), which would surface 40 minutes from now as a
          # failed refresh and a rollback. Refused here instead, before
          # anything changes. Staging runs either way and is told why its
          # admin surface will be closed.
          if [ -n "$PLATFORM_ADMIN_PHONES" ]; then
            admin_gaps=()
            [ -n "$MFA_KEYS" ]            || admin_gaps+=("secret SHIKKHOKPLUS_MFA_KEYS")
            [ -n "${ADMIN_ALLOWED_CIDRS// /}" ] || admin_gaps+=("secret SHIKKHOKPLUS_ADMIN_ALLOWED_CIDRS")
            if [ ${#admin_gaps[@]} -ne 0 ]; then
              if [ "${{ inputs.environment }}" = "production" ]; then
                echo "::error::SHIKKHOKPLUS_PLATFORM_ADMIN_PHONES is set but ${admin_gaps[*]} is not; production would refuse to start."
                exit 1
              fi
              echo "::warning::SHIKKHOKPLUS_PLATFORM_ADMIN_PHONES is set but ${admin_gaps[*]} is not; nobody will be able to use the admin surface."
            fi
          fi

          missing=()
          [ -n "$DEPLOY_ROLE" ]  || missing+=("variable AWS_DEPLOY_ROLE_ARN")
          [ -n "$INFRA_ROLE" ]   || missing+=("variable AWS_ROLE_ARN")
          [ -n "$BUCKET" ]       || missing+=("variable TF_STATE_BUCKET")
          [ -n "$APEX" ]         || missing+=("variable APEX_DOMAIN")
          [ -n "$OTP_HMAC_KEY" ] || missing+=("secret SHIKKHOKPLUS_OTP_HMAC_KEY")
          [ -n "$JWT_KEYS" ]     || missing+=("secret SHIKKHOKPLUS_JWT_KEYS")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Not configured for '${{ inputs.environment }}': ${missing[*]}"
            echo "Set these under Settings -> Environments -> ${{ inputs.environment }}."
            echo "The two role ARNs come from the infra/bootstrap output and"
            echo "are NOT the same role: AWS_ROLE_ARN applies infrastructure,"
            echo "AWS_DEPLOY_ROLE_ARN pushes images and refreshes the ASG."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-plan-${{ github.run_id }}

      - name: Resolve the registry and the group
        id: resolve
        run: |
          prefix="shikkhokplus-${{ inputs.environment }}"
          repo=$(aws ecr describe-repositories \
            --repository-names "$prefix-backend" \
            --query 'repositories[0].repositoryUri' --output text 2>/dev/null) || repo=""

          echo "repository=$repo" >> "$GITHUB_OUTPUT"
          echo "asg=$prefix" >> "$GITHUB_OUTPUT"

          {
            echo "### Deploying to ${{ inputs.environment }}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${{ inputs.ref || github.ref_name }}\` |"
            echo "| commit | \`$(git rev-parse --short=12 HEAD)\` |"
            echo "| registry | \`${repo:-(not created yet)}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # 2. Infrastructure. Always runs; Terraform decides what to do.
  # ---------------------------------------------------------------
  infrastructure:
    name: infrastructure
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # **`<env>-infra`, and the reviewer differs by environment.**
    #
    # Terraform now runs on every deploy, so a required reviewer here
    # would stop every deploy -- and an approval clicked on every
    # staging deploy becomes a reflex, which is when it stops
    # catching the one that mattered.
    #
    # So: `staging-infra` has NO reviewer and staging runs end to
    # end; `production-infra` has a required reviewer and a
    # production apply always stops for a human to read the plan
    # printed in the step before it. Same workflow, different
    # ceremony, set in Settings -> Environments rather than in YAML.
    environment: ${{ inputs.environment }}-infra
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # The INFRASTRUCTURE role, which can create and destroy.
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-infra-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Init
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.environment }}/terraform.tfstate"

      # **Whether this run may create the staging seeder**
      # (infra/modules/seeder). Three rules, in order:
      #
      #   * Staging only, whatever ENABLE_SEEDER says. A repository-level
      #     variable reaches every environment, and production's plan
      #     refuses the seeder -- so passing it through would fail every
      #     production deploy rather than protect anything.
      #   * Once the function exists it stays on. Deploys own its image;
      #     a check below turning it off would DESTROY it.
      #   * Creating it needs the RUNNING image to be a single manifest.
      #     This job runs before the build, so the function is created
      #     from the last release, and an image built before
      #     `provenance: false` is an OCI index Lambda refuses. Then the
      #     seeder waits one deploy instead of failing this one, which
      #     would also stop the release that fixes it.
      #
      # `get-function-configuration` prints ONLY the name: its response
      # carries the function's environment, the database URL.
      - name: Can the seeder be created on this run?
        id: seeder
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          WANTED: ${{ vars.ENABLE_SEEDER }}
        run: |
          prefix="shikkhokplus-${ENVIRONMENT}"
          if [ "$ENVIRONMENT" != "staging" ] || [ "$WANTED" != "true" ]; then
            echo "Seeder off (staging only, and only with ENABLE_SEEDER=true)."
            echo "enable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if aws lambda get-function-configuration --function-name "${prefix}-seeder" \
               --query FunctionName --output text >/dev/null 2>&1; then
            echo "Seeder exists; keeping it."
            echo "enable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(aws ssm get-parameter --name "/shikkhokplus/${prefix}/image-tag" \
                  --query Parameter.Value --output text)
          media=none
          if [ "$tag" != "none" ]; then
            media=$(aws ecr describe-images --repository-name "${prefix}-backend" \
                      --image-ids imageTag="$tag" \
                      --query 'imageDetails[0].imageManifestMediaType' --output text)
          fi
          case "$media" in
            application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json)
              echo "Creating the seeder on ${tag:0:12} (${media})."
              echo "enable=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::The seeder is not created on this run: the running image (${tag:0:12}) is ${media}, which Lambda refuses. This release ships a plain manifest; deploy again and the seeder is created then."
              echo "enable=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Plan
        working-directory: infra
        env:
          TF_VAR_apex_domain: ${{ vars.APEX_DOMAIN }}
          TF_VAR_environment: ${{ inputs.environment }}
          # Where alarms are emailed [OPS-11]. Unset is allowed and
          # reported by the alert_email_status output, not hidden.
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          # The performance-test seeder: decided by the step above.
          TF_VAR_enable_seeder: ${{ steps.seeder.outputs.enable }}
          # Who may reach the admin hostname (infra/modules/admin): a
          # comma-separated repository SECRET, not a variable, because this
          # repository is public and so are its Actions logs -- an admin's
          # home or office address is not something to publish. The
          # Terraform variable is `sensitive`, so the plan prints the
          # function code as (sensitive value), and this step prints only
          # how many networks there are. One list serves the
          # edge function here and the application's own check (the
          # runtime env, below). Turned into the JSON list Terraform reads
          # from a list-typed TF_VAR_*, blanks trimmed and empty entries
          # dropped. Unset becomes [] -- which lets nobody in, by design.
          ADMIN_ALLOWED_CIDRS: ${{ secrets.SHIKKHOKPLUS_ADMIN_ALLOWED_CIDRS }}
        run: |
          TF_VAR_admin_allowed_cidrs=$(jq -cn --arg cidrs "$ADMIN_ALLOWED_CIDRS" \
            '$cidrs | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          export TF_VAR_admin_allowed_cidrs
          # Mask each entry too: the secret is masked as one string, and a
          # single CIDR split out of it would otherwise print in clear.
          for cidr in $(jq -r '.[]' <<<"$TF_VAR_admin_allowed_cidrs"); do
            echo "::add-mask::$cidr"
          done
          echo "Admin allowlist: $(jq 'length' <<<"$TF_VAR_admin_allowed_cidrs") network(s)"
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: What is about to be applied
        run: |
          {
            echo "### Terraform plan"
            echo ""
            echo '```terraform'
            head -c 60000 infra/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        working-directory: infra
        # The saved plan, so what is applied is exactly what printed
        # above. A saved plan carries its own variables and rejects
        # -var, so none are passed here.
        run: terraform apply -input=false tfplan

  # ---------------------------------------------------------------
  # 3. Build, push, and roll the instance. Every deploy.
  # ---------------------------------------------------------------
  release:
    name: build and release
    needs: [plan, infrastructure]
    # No `always()` and no result checks: `needs` alone now expresses
    # it, because infrastructure runs on every deploy and a failed
    # dependency skips this job by default.
    #
    # The earlier version tolerated a SKIPPED infrastructure job,
    # which it no longer can be -- and that tolerance was load-bearing
    # only for the change-detection this replaced.
    runs-on: ubuntu-latest
    # A refresh can take 40 minutes (the readiness hook's own timeout
    # plus one retry), a rollback is a second refresh, and the snapshot
    # wait is bounded at 30.
    timeout-minutes: 130
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: What identity is being presented
        run: |
          token=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')
          payload=$(echo "$token" | cut -d. -f2)
          python3 -c "
          import base64, json, sys
          s = sys.argv[1]; s += '=' * (-len(s) % 4)
          d = json.loads(base64.urlsafe_b64decode(s))
          for k in ('sub','aud','repository','ref','environment','event_name'):
              print(f'  {k:12} {d.get(k, \"(absent)\")}')
          " "$payload"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-release-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Resolve the registry
        id: ecr
        run: |
          repo=$(aws ecr describe-repositories \
            --repository-names "shikkhokplus-${{ inputs.environment }}-backend" \
            --query 'repositories[0].repositoryUri' --output text 2>/dev/null) || {
            echo "::error::No ECR repository for ${{ inputs.environment }}."
            echo "It is created by the infrastructure job. If that job was"
            echo "skipped, infrastructure has never been applied for this"
            echo "environment -- change something under infra/ or apply once"
            echo "manually."
            exit 1
          }
          echo "repository=$repo" >> "$GITHUB_OUTPUT"

      # **Is this commit already built?**
      #
      # The tag is the commit SHA and the repository is IMMUTABLE, so
      # re-deploying a commit -- which is what every retry after a
      # later failure is -- tried to push a tag that already exists
      # and failed with "cannot be overwritten".
      #
      # That is the repository behaving correctly: a SHA tag IS the
      # artifact, which is what makes a rollback a redeploy rather
      # than a rebuild. The bug was the pipeline assuming every run
      # pushes something new.
      #
      # Skipping the push is also the RIGHT answer rather than a
      # workaround: the image for this commit already exists and is
      # byte-identical to what another build would produce, so
      # rebuilding it would spend five minutes to arrive at the same
      # digest.
      - name: Is this commit already built?
        id: exists
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          if aws ecr describe-images \
               --repository-name "shikkhokplus-${{ inputs.environment }}-backend" \
               --image-ids imageTag="$SHA" >/dev/null 2>&1; then
            echo "Image for ${SHA:0:12} already in the registry."
            echo "Skipping the build; the existing image is the artifact."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          # The commit SHA, never `latest`. The repository is
          # IMMUTABLE, so the tag IS the artifact and a rollback is a
          # redeploy rather than a rebuild.
          tags: ${{ steps.ecr.outputs.repository }}:${{ needs.plan.outputs.sha }}
          push: true
          # **A plain single-platform manifest, no attestations.** buildx
          # otherwise pushes an OCI image index carrying a provenance
          # attestation, which Lambda refuses outright -- and the staging
          # seeder (infra/modules/seeder) runs this same image. The host's
          # `docker pull` accepts either shape, so this changes the
          # manifest the registry holds and not what any host runs.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # **What is running now, kept so a failed release can be undone.**
      # The rollback below restores exactly these two parameters; with
      # them back, any replacement host boots the previous release.
      # The runtime env is a secret, so it goes to a 0600 file in the
      # runner's temp directory, never to an output or the log.
      - name: Remember the running release
        id: previous
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          umask 077
          base="/shikkhokplus/shikkhokplus-${ENVIRONMENT}"
          tag=$(aws ssm get-parameter --name "$base/image-tag" \
            --query 'Parameter.Value' --output text)
          aws ssm get-parameter --name "$base/runtime-env" --with-decryption \
            --query 'Parameter.Value' --output text > "$RUNNER_TEMP/previous-runtime.env"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Running before this deploy: ${tag:0:12}"

      # **A named restore point before anything can migrate** [OPS-7].
      #
      # The new host runs `alembic upgrade head` at boot. RDS's
      # automated backups give point-in-time recovery to about five
      # minutes, but no named point that says "the database as it was
      # before release X" -- and under pressure the difference between
      # "restore snapshot predeploy-<sha>" and "work out the right
      # second" is the difference between a runbook and a guess.
      #
      # **Fails the deploy rather than proceeding without one**, and
      # BEFORE the deployment state is written, so a failure here
      # changes nothing. A missing RDS instance is a failure too: this
      # pipeline replaces the host on every deploy, and a database on
      # the host's root volume (enable_rds = false) would be deleted
      # with it.
      #
      # The newest seven pre-deploy snapshots are kept. Older ones are
      # deleted so manual snapshots stay within the backup storage RDS
      # includes free (up to the database's allocated size).
      - name: Snapshot the database
        id: snapshot
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          db="shikkhokplus-${ENVIRONMENT}-db"
          if ! found=$(aws rds describe-db-instances \
                --db-instance-identifier "$db" \
                --query 'DBInstances[0].DBInstanceStatus' --output text 2>&1); then
            echo "::error::Cannot snapshot $db before migrating: $found"
            echo "This pipeline replaces the host on every deploy. Without"
            echo "RDS (enable_rds = true) the database would be on the"
            echo "host's root volume and deleted with it."
            exit 1
          fi
          echo "$db is $found"

          prefix="shikkhokplus-${ENVIRONMENT}-predeploy-"
          snap="${prefix}${SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          aws rds create-db-snapshot \
            --db-instance-identifier "$db" \
            --db-snapshot-identifier "$snap" \
            --tags "Key=Purpose,Value=pre-deploy" "Key=Commit,Value=$SHA" >/dev/null
          echo "Waiting for $snap..."
          if ! aws rds wait db-snapshot-available --db-snapshot-identifier "$snap"; then
            echo "::error::Snapshot $snap did not become available. Not deploying."
            exit 1
          fi
          echo "snapshot=$snap" >> "$GITHUB_OUTPUT"
          echo "| pre-deploy snapshot | \`$snap\` |" >> "$GITHUB_STEP_SUMMARY"

          aws rds describe-db-snapshots --db-instance-identifier "$db" \
            --snapshot-type manual \
            --query "sort_by(DBSnapshots[?starts_with(DBSnapshotIdentifier, '$prefix')], &SnapshotCreateTime)[].DBSnapshotIdentifier" \
            --output text | tr '\t' '\n' | sed '/^$/d' | head -n -7 \
            | while read -r old; do
                echo "Pruning $old"
                aws rds delete-db-snapshot --db-snapshot-identifier "$old" >/dev/null
              done

      # **Written BEFORE the refresh.** A replaced instance reads
      # these at boot. Writing them after would leave a window in
      # which a replacement comes back on the PREVIOUS image.
      - name: Record the deployment state
        id: record
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          OTP_HMAC_KEY: ${{ secrets.SHIKKHOKPLUS_OTP_HMAC_KEY }}
          JWT_KEYS: ${{ secrets.SHIKKHOKPLUS_JWT_KEYS }}
          SMS_API_KEY: ${{ secrets.SHIKKHOKPLUS_SMS_API_KEY }}
          SMS_SENDER_ID: ${{ secrets.SHIKKHOKPLUS_SMS_SENDER_ID }}
          SMS_BASE_URL: ${{ vars.SHIKKHOKPLUS_SMS_BASE_URL }}
          SMS_APP_HASH: ${{ vars.SHIKKHOKPLUS_SMS_APP_HASH }}
          DAILY_SMS: ${{ vars.SHIKKHOKPLUS_GLOBAL_DAILY_SMS }}
          STAGING_OUTBOX: ${{ vars.SHIKKHOKPLUS_STAGING_OUTBOX }}
          PLATFORM_ADMIN_PHONES: ${{ secrets.SHIKKHOKPLUS_PLATFORM_ADMIN_PHONES }}
          ADMIN_ALLOWED_CIDRS: ${{ secrets.SHIKKHOKPLUS_ADMIN_ALLOWED_CIDRS }}
          MFA_KEYS: ${{ secrets.SHIKKHOKPLUS_MFA_KEYS }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          umask 077

          # **The X-Admin-Edge value, read before anything is written.**
          # Terraform generates it (infra/modules/admin) and the admin
          # distribution sends it; the application must hold the same
          # value or every admin route refuses. Read here, not stored as a
          # GitHub secret, so the two can never disagree. Failing now
          # leaves the previous image tag and runtime env untouched.
          if ! ADMIN_EDGE_SECRET=$(aws ssm get-parameter \
                --name "/shikkhokplus/shikkhokplus-${ENVIRONMENT}/admin-edge-secret" \
                --with-decryption --query 'Parameter.Value' --output text) \
             || ! [[ "$ADMIN_EDGE_SECRET" =~ ^[A-Za-z0-9]{32,}$ ]]; then
            echo "::error::Cannot read the admin edge secret from SSM."
            echo "Either the infrastructure job has not applied infra/modules/admin,"
            echo "or the deploy role predates it: re-apply infra/bootstrap once,"
            echo "from a laptop. Nothing has been recorded or rolled."
            exit 1
          fi

          {
            echo "SHIKKHOKPLUS_ENVIRONMENT=${ENVIRONMENT}"
            echo "SHIKKHOKPLUS_OTP_HMAC_KEY=${OTP_HMAC_KEY}"
            echo "SHIKKHOKPLUS_JWT_KEYS=${JWT_KEYS}"
            echo "SHIKKHOKPLUS_JWT_ACTIVE_KID=k1"
            echo "SHIKKHOKPLUS_SMS_APP_HASH=${SMS_APP_HASH:-AAAAAAAAAAA}"
            echo "SHIKKHOKPLUS_GLOBAL_DAILY_SMS=${DAILY_SMS:-50}"
            echo "SHIKKHOKPLUS_SMS_ADAPTER=${SMS_API_KEY:+bulksmsbd}"
            echo "SHIKKHOKPLUS_SMS_BASE_URL=${SMS_BASE_URL}"
            echo "SHIKKHOKPLUS_SMS_API_KEY=${SMS_API_KEY}"
            echo "SHIKKHOKPLUS_SMS_SENDER_ID=${SMS_SENDER_ID}"
            # Exposes the most recent OTP to an UNAUTHENTICATED
            # caller, so anyone who can reach the API can sign in as
            # anyone. Off unless explicitly enabled, and a production
            # process with it set refuses to start.
            echo "SHIKKHOKPLUS_STAGING_OUTBOX=${STAGING_OUTBOX:-0}"
            # The ONLY client address the API may trust for the per-IP
            # OTP ceiling: nginx always overwrites it with CloudFront's
            # viewer IP. Every environment, so staging exercises what
            # production requires -- a production process without it
            # refuses to start.
            echo "SHIKKHOKPLUS_TRUSTED_CLIENT_IP_HEADER=X-Client-Address"
            # Who may open the platform administration surface: a
            # comma-separated list of phone numbers. A secret rather than
            # a variable because it is people's numbers. Unset means
            # nobody -- the routes answer 403 to every account.
            echo "SHIKKHOKPLUS_PLATFORM_ADMIN_PHONES=${PLATFORM_ADMIN_PHONES}"
            # The admin surface's two network locks behind the edge
            # function (app/authz/admin.py): the secret only the admin
            # distribution sends, and the same allowlist checked again on
            # X-Client-Address. Either one empty refuses every admin
            # route -- fail closed, like the phones above.
            echo "SHIKKHOKPLUS_ADMIN_EDGE_SECRET=${ADMIN_EDGE_SECRET}"
            echo "SHIKKHOKPLUS_ADMIN_ALLOWED_CIDRS=${ADMIN_ALLOWED_CIDRS}"
            # The keyring that encrypts administrators' authenticator
            # secrets (AES-256-GCM, app/auth/mfa_crypto.py): `k1:<base64
            # of 32 random bytes>`, made with
            #   python3 -c "import os,base64;print('k1:'+base64.b64encode(os.urandom(32)).decode())"
            # Losing it means every administrator re-enrolls; rotating it
            # means adding k2 beside k1, not replacing k1.
            echo "SHIKKHOKPLUS_MFA_KEYS=${MFA_KEYS}"
            echo "SHIKKHOKPLUS_MFA_ACTIVE_KID=k1"
          } > runtime.env

          aws ssm put-parameter \
            --name "/shikkhokplus/shikkhokplus-${ENVIRONMENT}/image-tag" \
            --value "$SHA" --type String --overwrite >/dev/null

          aws ssm put-parameter \
            --name "/shikkhokplus/shikkhokplus-${ENVIRONMENT}/runtime-env" \
            --value "file://runtime.env" --type SecureString --overwrite >/dev/null

          rm -f runtime.env
          echo "Deployment state recorded for ${ENVIRONMENT}."

      # **The rollout: replace the instance so it re-runs user_data.**
      #
      # Not `docker compose pull` over SSM. A refresh exercises the
      # same path a replacement takes after a failure, so the
      # self-healing boot is tested on every deploy rather than only
      # on the day it matters.
      #
      # **Launch before terminate, gated on readiness** [OPS-6]. This
      # was MinHealthyPercentage 0 with an EC2 health check, so every
      # deploy terminated the only host first and counted a booted-but-
      # broken replacement as healthy. deploy/roll.sh documents the
      # replacement's lifecycle; in short, the old host serves until the
      # new one has proved it answers /health through nginx over
      # verified TLS.
      - name: Roll the instance
        id: roll
        run: deploy/roll.sh "shikkhokplus-${{ inputs.environment }}"

      # **The deploy is not done until the PUBLIC URL answers** [OPS-6].
      # This was a curl to 127.0.0.1 over SSM on the instance, which
      # proved the container answered and nothing about CloudFront, the
      # origin certificate, nginx's origin-secret check or DNS -- every
      # one of which has failed on this project with a healthy
      # container behind it. Through CloudFront, and at the migration
      # head this commit declares.
      - name: Smoke through CloudFront
        id: smoke
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          url=$(aws ssm get-parameter \
            --name "/shikkhokplus/shikkhokplus-${ENVIRONMENT}/api-url" \
            --query 'Parameter.Value' --output text)
          echo "Smoke: $url"
          python3 deploy/smoke.py "$url" --attempts 18 --interval 10

      # **The rollback, automatic.** Any failure after the deployment
      # state was recorded puts the previous image tag and runtime env
      # back, so no future replacement boots the failed release.
      #
      # Whether the host itself must be rolled again depends on where
      # it failed. A failed REFRESH never put the new host in service --
      # the previous host is still serving -- so restoring SSM is the
      # whole rollback. A failed SMOKE means the new host is the one
      # serving, so a second launch-before-terminate refresh boots the
      # previous release beside it and replaces it.
      #
      # The schema is NOT rolled back. Migrations are forward-only and
      # must stay compatible with the previous release [team.md
      # Deployment]; the pre-deploy snapshot above is the recovery path
      # when one was not, and infra/RESTORE.md is how to use it.
      - name: Roll back to the previous release
        if: failure() && steps.record.outcome == 'success'
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.tag }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          base="/shikkhokplus/shikkhokplus-${ENVIRONMENT}"
          aws ssm put-parameter --name "$base/image-tag" \
            --value "$PREVIOUS_TAG" --type String --overwrite >/dev/null
          aws ssm put-parameter --name "$base/runtime-env" \
            --value "file://$RUNNER_TEMP/previous-runtime.env" \
            --type SecureString --overwrite >/dev/null
          echo "Restored the previous release (${PREVIOUS_TAG:0:12}) in SSM."
          if [ "$SMOKE" = "failure" ]; then
            echo "The failed release is serving; rolling the host back."
            deploy/roll.sh "shikkhokplus-${ENVIRONMENT}"
          fi
          echo "::error::Deploy failed and was rolled back to ${PREVIOUS_TAG:0:12}."

      # **The staging seeder follows the release** (infra/modules/seeder),
      # so it never writes against a schema its code predates. After the
      # rollback step, so it runs only for a release that stands, and
      # non-blocking: a test tool must not fail a good release or hold
      # back the web client behind it. A failure is a warning on the run.
      #
      # **One field of the response is printed, never the response.**
      # UpdateFunctionCode answers with the function's configuration,
      # environment included -- its database URL.
      - name: Move the seeder to this release
        continue-on-error: true
        env:
          FUNCTION: shikkhokplus-${{ inputs.environment }}-seeder
          IMAGE: ${{ steps.ecr.outputs.repository }}:${{ needs.plan.outputs.sha }}
        run: |
          if status=$(aws lambda update-function-code --function-name "$FUNCTION" \
                --image-uri "$IMAGE" --query 'LastUpdateStatus' --output text \
                2>"$RUNNER_TEMP/seeder.err"); then
            echo "Seeder moved to this release (update ${status})."
          elif grep -q ResourceNotFoundException "$RUNNER_TEMP/seeder.err"; then
            echo "No seeder in this environment: enable_seeder is off."
          else
            cat "$RUNNER_TEMP/seeder.err"
            echo "::warning::The seeder was not moved to this release; it runs the previous image until the next deploy."
            exit 1
          fi

      - name: Forget the previous runtime env
        if: always()
        run: rm -f "$RUNNER_TEMP/previous-runtime.env"

  # ---------------------------------------------------------------
  # 4. The web client: build for /ui/, upload, invalidate, smoke.
  # ---------------------------------------------------------------
  #
  # **After the API release, never beside it.** The web client calls the
  # API this release just shipped, and a UI that reached users before
  # its API would call routes that do not exist yet. `needs: release`
  # also means a release that failed and rolled back ships no UI: the
  # previous UI stays, matched to the previous API it was built for.
  #
  # **Served by the API's own distribution under /ui/**
  # (infra/modules/cdn/web.tf), so the UI and /v1 share an origin and no
  # CORS is configured. The bucket name and distribution id come from
  # SSM parameters Terraform publishes, never from state [OPS-3].
  web:
    name: web client
    needs: [plan, release]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The blocking half of the two-speed CVE model for what the web
      # client SHIPS, production only, as pip-audit is for the API.
      # Build-time tooling is not shipped to anyone and is not gated
      # here; check.yml annotates it on every push.
      - name: Release gate - web dependency CVEs
        if: inputs.environment == 'production'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      # The same gate CI runs (generated-file drift, format, lint, types,
      # tests, build), with the build aimed at /ui/: asset URLs, the
      # manifest's scope and the service worker's scope all follow it.
      - name: Check and build for /ui/
        env:
          WEB_BASE: /ui/
        run: make web

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-web-${{ github.run_id }}

      - name: Resolve where it goes
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          base="/shikkhokplus/shikkhokplus-${ENVIRONMENT}"
          read_param() {
            aws ssm get-parameter --name "$base/$1" --query 'Parameter.Value' --output text
          }
          if ! bucket=$(read_param web-bucket) || ! dist=$(read_param distribution-id) \
             || ! url=$(read_param web-url); then
            echo "::error::Cannot read the web client's target from SSM."
            echo "Either the infrastructure job has not yet applied the web"
            echo "resources (infra/modules/cdn/web.tf), or the deploy role"
            echo "predates them: re-apply infra/bootstrap once, from a laptop."
            exit 1
          fi
          {
            echo "bucket=$bucket"
            echo "distribution=$dist"
            echo "url=$url"
          } >> "$GITHUB_OUTPUT"
          echo "| web client | $url |" >> "$GITHUB_STEP_SUMMARY"

      # **Order is what keeps open tabs working.** Hashed assets first,
      # immutable and not yet pruned, so a page that loaded the previous
      # index.html a moment ago still finds its files. Then the entry
      # files that name them, no-cache, so the new release is picked up
      # on the next load. Only then are assets the new build no longer
      # references removed. Source maps are not published.
      - name: Upload
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        working-directory: web/dist
        run: |
          dest="s3://$BUCKET/ui"
          aws s3 sync assets "$dest/assets" --exclude "*.map" --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync fonts "$dest/fonts" --only-show-errors --delete \
            --cache-control "public, max-age=86400"
          # .ttf is not in every MIME table the CLI consults; say it.
          aws s3 cp fonts "$dest/fonts" --recursive --exclude "*" --include "*.ttf" \
            --only-show-errors --content-type font/ttf --cache-control "public, max-age=86400"
          aws s3 sync icons "$dest/icons" --only-show-errors --delete \
            --cache-control "public, max-age=86400"

          aws s3 sync . "$dest" --only-show-errors --delete \
            --exclude "assets/*" --exclude "fonts/*" --exclude "icons/*" --exclude "*.map" \
            --cache-control "no-cache"
          aws s3 cp manifest.webmanifest "$dest/manifest.webmanifest" --only-show-errors \
            --content-type application/manifest+json --cache-control "no-cache"

          aws s3 sync assets "$dest/assets" --exclude "*.map" --only-show-errors --delete \
            --cache-control "public, max-age=31536000, immutable"

      # Entry files are no-cache already; the invalidation makes every edge
      # drop its copy now rather than at its next revalidation, so the
      # smoke below sees this release and not the last one.
      - name: Invalidate
        env:
          DISTRIBUTION: ${{ steps.target.outputs.distribution }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/ui" "/ui/*" --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation $id..."
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      # **Through CloudFront, and for THIS build**: the page must name the
      # script this build produced, so a stale edge copy fails the smoke
      # instead of passing it. Also a client route (the SPA fallback),
      # the manifest's scope, and the UI hostname's root redirect.
      - name: Smoke the web client
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          script=$(grep -o 'src="/ui/assets/[^"]*\.js"' web/dist/index.html | head -1 | cut -d'"' -f2)
          origin="${URL%/ui/}"
          for attempt in $(seq 1 12); do
            if curl -fsS "$URL" | grep -qF "$script"; then break; fi
            [ "$attempt" = 12 ] && { echo "::error::$URL does not serve this build ($script)."; exit 1; }
            sleep 10
          done
          curl -fsS "${URL}dues" | grep -qF '<div id="root">' \
            || { echo "::error::A client route did not fall back to index.html."; exit 1; }
          curl -fsS "${URL}manifest.webmanifest" | grep -qF '"scope":"/ui/"' \
            || { echo "::error::The manifest is missing or has the wrong scope."; exit 1; }
          curl -fsS -o /dev/null "$origin$script" \
            || { echo "::error::$script did not load."; exit 1; }
          # Only a UI with its own hostname redirects "/"; on the API
          # hostname "/" is the API's and is left alone.
          case "$origin" in
            https://api.*) ;;
            *)
              if [ "$(curl -s -o /dev/null -w '%{redirect_url}' "$origin/")" != "$origin/ui/" ]; then
                echo "::error::$origin/ does not redirect to /ui/."; exit 1
              fi
              ;;
          esac
          echo "Web client is live at $URL"

  # ---------------------------------------------------------------
  # 5. The public site: build, upload, invalidate, smoke.
  # ---------------------------------------------------------------
  #
  # **After infrastructure, NOT after the release.** The site is static
  # HTML that calls no API, so a failed or rolled-back API release has no
  # bearing on it, and waiting for a 40-minute instance refresh would only
  # delay a copy change. It needs the infrastructure job because that is
  # what creates its bucket, distribution and SSM parameters.
  #
  # **Served at the project zone's apex by its own distribution**
  # (infra/modules/site). The bucket, distribution and URLs come from SSM
  # parameters Terraform publishes, never from state [OPS-3].
  site:
    name: public site
    needs: [plan, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # No npm cache: the site has no dependencies and no lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-site-${{ github.run_id }}

      # The site's own three parameters, plus the web client's and the
      # API's URLs, which the pages link to (Open the web app, the
      # account-deletion page).
      - name: Resolve where it goes
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          base="/shikkhokplus/shikkhokplus-${ENVIRONMENT}"
          read_param() {
            aws ssm get-parameter --name "$base/$1" --query 'Parameter.Value' --output text
          }
          if ! bucket=$(read_param site-bucket) || ! dist=$(read_param site-distribution-id) \
             || ! url=$(read_param site-url) || ! web=$(read_param web-url) \
             || ! api=$(read_param api-url); then
            echo "::error::Cannot read the site's target from SSM."
            echo "Either the infrastructure job has not yet applied the site"
            echo "resources (infra/modules/site), or the deploy role predates"
            echo "them: re-apply infra/bootstrap once, from a laptop."
            exit 1
          fi
          {
            echo "bucket=$bucket"
            echo "distribution=$dist"
            echo "url=$url"
            echo "web=$web"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"
          echo "| public site | $url |" >> "$GITHUB_STEP_SUMMARY"

      # **The build only, not `make site`.** The site's tests ran on the
      # pull request (check.yml), and a deploy is not the place to discover
      # a red suite (tests/gates/test_deploy_runs_no_tests.py). The build
      # still refuses an unknown placeholder or a missing asset, and the
      # smoke below checks what it produced, through CloudFront.
      - name: Build with this environment's URLs
        working-directory: site
        env:
          SITE_URL: ${{ steps.target.outputs.url }}
          WEB_APP_URL: ${{ steps.target.outputs.web }}
          API_URL: ${{ steps.target.outputs.api }}
        run: npm run build

      # **Order keeps open pages whole.** Hashed assets first, with
      # nothing deleted, so a page served a moment ago still finds its
      # stylesheet and images. Then the pages that name them. Old files
      # are pruned only after the invalidation below has completed.
      #
      # **Content-Type is set per extension, never guessed.** The CLI's
      # guess depends on the MIME table of whatever Python it bundles, and
      # a stylesheet served with the wrong type is ignored by the browser
      # under `X-Content-Type-Options: nosniff`. A file with an extension
      # this table lacks fails the step instead of uploading untyped.
      #
      # Cache-Control is the whole caching scheme (infra/modules/site):
      #   assets/*  a year, immutable -- a changed file is a new name;
      #   the rest  five minutes in a browser, a year at the edge
      #             (s-maxage), which the invalidation empties per release.
      - name: Upload
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        working-directory: site/dist
        run: |
          set -euo pipefail
          immutable="public, max-age=31536000, immutable"
          page="public, max-age=300, s-maxage=31536000"

          unknown=$(find . -type f ! -name '*.css' ! -name '*.svg' ! -name '*.png' \
            ! -name '*.webp' ! -name '*.ttf' ! -name '*.html' ! -name '*.xml' \
            ! -name '*.txt' ! -name '*.ico')
          if [ -n "$unknown" ]; then
            echo "::error::No Content-Type for: $unknown (add it to this step and to site/build.mjs)"
            exit 1
          fi

          put() { # <dir> <s3 prefix> <glob> <content-type> <cache-control>
            aws s3 cp "$1" "s3://$BUCKET/$2" --recursive --only-show-errors \
              --exclude "*" --include "$3" --content-type "$4" --cache-control "$5"
          }
          put assets assets/ "*.css"  "text/css; charset=utf-8" "$immutable"
          put assets assets/ "*.svg"  "image/svg+xml"           "$immutable"
          put assets assets/ "*.png"  "image/png"               "$immutable"
          put assets assets/ "*.webp" "image/webp"              "$immutable"
          put assets assets/ "*.ttf"  "font/ttf"                "$immutable"

          put . "" "*.ico"       "image/x-icon"                      "$page"
          put . "" "*.txt"       "text/plain; charset=utf-8"         "$page"
          put . "" "sitemap.xml" "application/xml; charset=utf-8"    "$page"
          put . "" "*.html"      "text/html; charset=utf-8"          "$page"

      # Every edge drops its year-long copy of every page now, so the smoke
      # below -- and every visitor -- sees this release. Waiting for it to
      # complete is also what makes the prune safe.
      - name: Invalidate
        env:
          DISTRIBUTION: ${{ steps.target.outputs.distribution }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation $id..."
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      # **Only now are files the new build no longer has removed**: the
      # edges serve this release's pages, which name only this release's
      # assets. A browser still holding a previous page (five minutes at
      # most) holds its assets too -- they were immutable.
      - name: Prune old files
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        working-directory: site/dist
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "$BUCKET" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | while read -r key; do
                if [ -z "$key" ] || [ "$key" = "None" ]; then continue; fi
                if [ ! -f "$key" ]; then
                  echo "removing $key"
                  aws s3 rm "s3://$BUCKET/$key" --only-show-errors
                fi
              done

      # **Through CloudFront, and for THIS build**: the home page must name
      # the stylesheet this build produced, so a stale edge copy fails the
      # smoke instead of passing it. Then both languages, the directory
      # redirect, the asset caching, the 404 page and the www redirect.
      #
      # Retried, because on the first deploy the certificate, the alias
      # records and the www name can still be propagating.
      - name: Smoke the site
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          css=$(grep -o 'href="/assets/site\.[0-9a-f]*\.css"' site/dist/index.html | head -1 | cut -d'"' -f2)
          host="${URL#https://}"
          # Bodies are fetched whole before grep reads them: `curl | grep -q`
          # under pipefail can fail on curl's SIGPIPE when grep stops early.
          fetch() { curl -fsS "$1" 2>/dev/null || true; }
          for attempt in $(seq 1 18); do
            if grep -qF "$css" <<<"$(fetch "$URL/")"; then break; fi
            [ "$attempt" = 18 ] && { echo "::error::$URL/ does not serve this build ($css)."; exit 1; }
            sleep 10
          done
          grep -qF '<html lang="bn">' <<<"$(fetch "$URL/bn/")" \
            || { echo "::error::$URL/bn/ is not the Bangla home page."; exit 1; }
          grep -qF '<details' <<<"$(fetch "$URL/faq/")" \
            || { echo "::error::$URL/faq/ is not the FAQ."; exit 1; }
          grep -qF '<html lang="bn">' <<<"$(fetch "$URL/bn/faq/")" \
            || { echo "::error::$URL/bn/faq/ is not the Bangla FAQ."; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$URL/faq")
          [ "$code" = "301 $URL/faq/" ] \
            || { echo "::error::/faq answered '$code', not a 301 to /faq/."; exit 1; }

          grep -qi '^cache-control: .*immutable' <<<"$(curl -fsSI "$URL$css" | tr -d '\r')" \
            || { echo "::error::$css is not served immutable."; exit 1; }
          grep -qi "^content-security-policy: default-src 'none'" <<<"$(curl -fsSI "$URL/" | tr -d '\r')" \
            || { echo "::error::The home page has no strict Content-Security-Policy."; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/no-such-page/")
          [ "$code" = "404" ] || { echo "::error::A missing page answered $code, not 404."; exit 1; }

          for attempt in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "https://www.$host/faq/" || true)
            if [ "$code" = "301 $URL/faq/" ]; then break; fi
            [ "$attempt" = 18 ] && { echo "::error::www.$host answered '$code', not a 301 to $URL/faq/."; exit 1; }
            sleep 10
          done
          echo "The site is live at $URL"

  # ---------------------------------------------------------------
  # 6. The platform admin UI: build, upload, invalidate, smoke.
  # ---------------------------------------------------------------
  #
  # **After the API release, as the web client is.** The admin UI calls
  # the admin API this release just shipped, and a UI that reached an
  # administrator before its API would call routes that do not exist yet.
  # A release that failed and rolled back ships no admin UI either.
  #
  # **Served at admin.<zone> by its own distribution, behind an IPv4
  # allowlist** (infra/modules/admin). The bucket, distribution and URL
  # come from SSM parameters Terraform publishes, never from state
  # [OPS-3].
  #
  # **The smoke proves the locks, not the page.** This runner is not on
  # the allowlist, so it cannot load the UI -- and that is the assertion:
  # the admin host must answer it 403, and the public API host must answer
  # /v1/admin/... 404. A smoke that could see the admin UI from GitHub's
  # network would be reporting an open admin surface as a success.
  admin:
    name: admin UI
    needs: [plan, infrastructure, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The same gate the web job applies, for the same lockfile: the
      # blocking half of the two-speed CVE model for what the admin UI
      # SHIPS, production only.
      - name: Release gate - web dependency CVEs
        if: inputs.environment == 'production'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      # **The build only, not `make web`.** The web client's checks ran on
      # the pull request (check.yml) and again in the web job above; a
      # deploy is not the place to discover a red suite
      # (tests/gates/test_deploy_runs_no_tests.py). The admin build is
      # served at the admin host's root and writes web/dist-admin/.
      - name: Build the admin UI
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build:admin
          test -f dist-admin/index.html \
            || { echo "::error::npm run build:admin produced no dist-admin/index.html."; exit 1; }

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-admin-${{ github.run_id }}

      - name: Resolve where it goes
        id: target
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          base="/shikkhokplus/shikkhokplus-${ENVIRONMENT}"
          read_param() {
            aws ssm get-parameter --name "$base/$1" --query 'Parameter.Value' --output text
          }
          if ! bucket=$(read_param admin-bucket) || ! dist=$(read_param admin-distribution-id) \
             || ! url=$(read_param admin-url) || ! api=$(read_param api-url); then
            echo "::error::Cannot read the admin UI's target from SSM."
            echo "Either the infrastructure job has not yet applied the admin"
            echo "resources (infra/modules/admin), or the deploy role predates"
            echo "them: re-apply infra/bootstrap once, from a laptop."
            exit 1
          fi
          {
            echo "bucket=$bucket"
            echo "distribution=$dist"
            echo "url=$url"
            echo "api=$api"
          } >> "$GITHUB_OUTPUT"
          echo "| admin UI | $url (allowlisted networks only) |" >> "$GITHUB_STEP_SUMMARY"

      # **Order keeps an open admin tab working**, as for the web client:
      # hashed assets first, immutable and nothing deleted, so a page
      # loaded a moment ago still finds its files; then the entry files
      # that name them, no-cache. Old assets are pruned only after the
      # invalidation below. Source maps are not published.
      - name: Upload
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        working-directory: web/dist-admin
        run: |
          set -euo pipefail
          if [ -d assets ]; then
            aws s3 cp assets "s3://$BUCKET/assets" --recursive --exclude "*.map" \
              --only-show-errors --cache-control "public, max-age=31536000, immutable"
          fi
          aws s3 cp . "s3://$BUCKET" --recursive --exclude "assets/*" --exclude "*.map" \
            --only-show-errors --cache-control "no-cache"
          aws s3 cp index.html "s3://$BUCKET/index.html" --only-show-errors \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"

      - name: Invalidate
        env:
          DISTRIBUTION: ${{ steps.target.outputs.distribution }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Waiting for invalidation $id..."
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"

      # **Only now are files the new build no longer has removed**: every
      # edge serves this release's index.html, which names only this
      # release's assets.
      - name: Prune old files
        env:
          BUCKET: ${{ steps.target.outputs.bucket }}
        working-directory: web/dist-admin
        run: |
          set -euo pipefail
          aws s3api list-objects-v2 --bucket "$BUCKET" --query 'Contents[].Key' --output text \
            | tr '\t' '\n' | while read -r key; do
                if [ -z "$key" ] || [ "$key" = "None" ]; then continue; fi
                if [ ! -f "$key" ] || [[ "$key" == *.map ]]; then
                  echo "removing $key"
                  aws s3 rm "s3://$BUCKET/$key" --only-show-errors
                fi
              done

      # **From GitHub's network, which is not on the allowlist.** The admin
      # host must refuse this runner with the edge function's own 403
      # body, and the API host must refuse /v1/admin/... with the edge
      # function's own 404 body -- the bodies prove it was the edge that
      # answered, not the application behind it (which refuses too, but
      # is the second lock, not the one this checks).
      #
      # Retried, because on the first deploy the certificate and the alias
      # record can still be propagating (curl then reports 000).
      - name: Smoke the locks
        env:
          URL: ${{ steps.target.outputs.url }}
          API: ${{ steps.target.outputs.api }}
        run: |
          set -euo pipefail
          probe() { # <url> -> "<status> <body>"
            local body status
            body=$(mktemp)
            status=$(curl -s -o "$body" -w '%{http_code}' "$1" || true)
            printf '%s %s' "$status" "$(head -c 200 "$body")"
            rm -f "$body"
          }
          for attempt in $(seq 1 18); do
            got=$(probe "$URL/")
            if [ "$got" = "403 Not available from this network." ]; then break; fi
            [ "$attempt" = 18 ] && {
              echo "::error::$URL/ answered '$got' to an address off the allowlist, not the edge's 403."
              exit 1
            }
            sleep 10
          done
          got=$(probe "$URL/v1/admin/overview")
          [ "$got" = "403 Not available from this network." ] \
            || { echo "::error::$URL/v1/admin/overview answered '$got' off the allowlist, not 403."; exit 1; }

          got=$(probe "$API/v1/admin/overview")
          [ "$got" = "404 Not found." ] \
            || { echo "::error::$API/v1/admin/overview answered '$got', not the edge's 404: the API host serves the admin API."; exit 1; }
          echo "The admin host refuses this network, and the API host refuses admin routes."
