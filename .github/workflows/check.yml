name: check

# The same gate that runs locally. CI invokes `make check`, not a
# reimplementation of it: a gate reproducible only by pushing is a gate that
# gets bypassed, and a CI pipeline that has drifted from the local one is
# exactly that.
#
# Note what is absent: any secret. The whole per-push blocking suite runs on
# a fresh clone with no credential. The first scheduled exception is the
# packaging Bolt's bytecode scan, which needs a signing keystore — and it
# belongs in the release gate rather than here, for this reason.

# **No `push` trigger: nothing runs on merge.**
#
# This drops the post-merge run on main, and team.md calls that run
# "the only thing that catches a stale-base merge" -- a PR green
# against an older main can merge and break it. That risk is real and
# is accepted here, with one cheaper control available in its place:
# GitHub's "Require branches to be up to date before merging", under
# branch protection, forces the rebase BEFORE the merge rather than
# detecting the breakage after it. Turning that on closes the same
# hole at the gate.
#
# Without it, a broken main is found by the next PR's run rather than
# by a run of its own.
on:
  pull_request:
  # Manual, for re-running the gate against a branch without pushing an
  # empty commit to trigger it -- which is what people do otherwise, and
  # it pollutes the history of the branch under review.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    # **Raised from 10 on 2026-10-25, against a measurement rather than a
    # guess.** Run 40203674746 was cancelled at exactly 10 minutes with
    # pytest at 75%; the steps before it cost 81s in total (install 19s,
    # lockfile compile 43s, CVE audit 12s), so the suite itself needs
    # ~11.8 min and the job ~13.1. 20 leaves headroom without hiding a
    # trend: a job that starts taking 18 is telling you something.
    #
    # The length is not waste and is not to be optimised away by
    # collapsing it. `make test` runs the suite TWICE on purpose — 100%
    # branch on app.money, 80% line on the rest — because one run cannot
    # enforce two different floors, and the floor that is not enforced is
    # the one that quietly erodes. That reasoning is in the Makefile and
    # it still holds; the suite grew through D4-D6, the cap did not.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # **Full history, for Gitleaks.** The default is a shallow
          # clone of depth 1, and Gitleaks scans the range
          # `<before>^..<after>` for a push -- so it asks for a parent
          # the runner never fetched and fails with "ambiguous
          # argument ... unknown revision", having scanned 0 bytes.
          #
          # The failure mode is the dangerous one: it reports "no leaks
          # found in partial scan" on the way out. A secrets scan that
          # exits non-zero having scanned nothing is at least loud; one
          # that said "no leaks" and passed would be a control that had
          # silently stopped working.
          fetch-depth: 0

      # Step 1. Blocks absolutely, no severity threshold: binary, near-zero
      # false positive, always actionable by whoever just pushed.
      # Guards the guard. Gitleaks needs real history to diff a push
      # range, and in a shallow clone it logs "no leaks found in
      # partial scan" having read 0 bytes. It exits non-zero today, so
      # the breakage is loud -- but a scanner whose clean verdict can
      # come from an empty scan is one commit of upstream behaviour
      # away from passing while checking nothing.
      #
      # This asserts the precondition rather than trusting it.
      - name: History is deep enough to scan
        run: |
          count=$(git rev-list --count HEAD)
          if [ "$count" -lt 2 ]; then
            echo "::error::Only $count commit(s) in this clone."
            echo "The secrets scan needs full history -- check that"
            echo "actions/checkout still sets fetch-depth: 0."
            exit 1
          fi
          echo "$count commits available to scan."

      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Step 2. Lockfile verification, Python side.
      #
      # **This step was previously a label with no control behind it**: it
      # was named "Lockfile verification" and ran a bare `pip install -e`,
      # an unpinned resolve. Corrected 2026-10-22. A CI step may not be
      # labelled as a verification check unless it performs one -- a label
      # describing a control that is not there is worse than no label,
      # because the next reader is the same person with nobody to
      # contradict them.
      #
      # `--require-hashes` is the control. Every pin in requirements.txt
      # carries a sha256, and pip refuses the install if any artifact does
      # not match -- which is what detects a substituted or tampered wheel.
      # It also refuses if ANY requirement lacks a hash, so the file cannot
      # silently become partially unpinned.
      - name: Install from the lockfile
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install -e . --no-deps

      # **The lockfile must match pyproject.toml.** Without this, a
      # dependency added to pyproject and not recompiled installs nothing
      # and fails confusingly later, or worse, resolves from a stale pin.
      - name: Lockfile is current
        run: |
          python -m pip install pip-tools
          python -m piptools compile --quiet --extra dev --extra api \
            --generate-hashes --allow-unsafe \
            --output-file /tmp/requirements.check.txt pyproject.toml
          # Strip EVERY comment line, not just column-zero ones.
          # pip-compile indents its provenance annotations
          # ("    # via fastapi"), and `grep -v '^#'` keeps all 135 of
          # them -- so a resolution-order change that alters no pinned
          # version failed this check. What the lockfile promises is
          # the pins and the hashes; those are what this compares.
          strip() { sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' "$1"; }
          if ! diff -q \
              <(strip requirements.txt) \
              <(strip /tmp/requirements.check.txt) \
              >/dev/null; then
            echo "::error::requirements.txt does not match pyproject.toml."
            echo "Regenerate it:  make lock"
            diff <(strip requirements.txt) \
                 <(strip /tmp/requirements.check.txt) \
                 || true
            exit 1
          fi
          echo "Lockfile is current."

      # Step 2b. Dependency CVEs — the ANNOTATING half of the two-speed
      # model. This does not block: `continue-on-error` is deliberate and
      # is the affirmed practice. A solo developer who hits an unfixable
      # transitive Critical mid-unit, with no triage path and no second
      # reviewer, bypasses a hard gate once -- and after one bypass it is
      # decoration. The BLOCKING half lives at the release gate, where
      # each Critical and High is fixed or carries a dated row in
      # .security-exceptions.md.
      - name: Dependency CVEs (annotating, non-blocking)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --requirement requirements.txt \
                    --desc --strict --progress-spinner off \
            || echo "::warning::pip-audit reported findings. These do not block this push; they block the release gate."

      # Guards the guard, exactly as the Gitleaks step above does, and
      # for the same failure shape. `tests/conftest.py` skips the WHOLE
      # integration suite at module level when no Docker daemon is
      # reachable -- a reasonable skip locally, and a silent one. Without
      # this assertion a runner image that lost Docker would narrow
      # `make check` to its unit half, report green, and gate merges to
      # `main` having run none of the row-level-security probes, none of
      # the migration tests and none of the concurrency tests.
      #
      # The asymmetry this closes: Gitleaks has had its precondition
      # asserted since the first commit, because a scanner whose clean
      # verdict can come from an empty scan is worth distrusting. The
      # database suite is the stronger obligation -- it is what proves
      # the privacy boundary holds for children's data -- and had no
      # such assertion. Assigned to "before D1" in team.md on 2026-10-22
      # and built 2026-10-25, after a D4 dispatch measured the hole:
      # 24 of 28 tests skipped, zero failures, exit 0.
      #
      # This asserts the precondition rather than trusting it. The
      # second half -- that the suite actually RAN -- is the exit code
      # of `make check` itself once Docker is known present.
      - name: Docker is available for the integration suite
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::No Docker daemon on this runner."
            echo "tests/conftest.py skips the entire integration suite"
            echo "without one, so make check would pass having run"
            echo "neither the privacy probes nor the concurrency tests."
            exit 1
          fi
          echo "Docker $(docker info --format '{{.ServerVersion}}') available."

      # Steps 3-10. The Python half of `make check`.
      #
      # **Not bare `make check`, and the reason is the job split above.**
      # `check: lint typecheck test android android-quality` — so a bare
      # `make check` here runs the ENTIRE Android build a second time,
      # duplicating everything the `android-unit` job is running in
      # parallel, from a cold cache with no `setup-java` and no
      # `setup-gradle` in this job.
      #
      # That is what cancelled run 40202019691 on 2026-10-25: pytest
      # passed at 92.55% coverage with ~9.5 of the 10 minutes gone,
      # Gradle then started from scratch, and the job was terminated 38
      # seconds later still downloading a toolchain. The tell was two
      # orphaned `java` processes killed at `Complete job` in a job that
      # installs no JDK.
      #
      # Splitting the jobs was pointless while this line reunited them:
      # a Kotlin failure here would still have failed the backend job,
      # which is exactly what the split exists to prevent.
      #
      # `make check` stays whole for LOCAL use, where one command
      # covering both surfaces is the point and there is no parallel job
      # to duplicate.
      - name: make check (python half)
        run: make lint typecheck test

  android-unit:
    name: android-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Split from the backend job so a Kotlin build never gates a backend
    # change, and so the minute budget stays attributable per surface.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Step 11. Compiles core/model inside the :app module and runs the
      # money serialization test as a LOCAL JVM unit test.
      #
      # This needs the Android SDK — core/model lives inside an Android
      # application module, by the settled one-module decision — but no
      # emulator, no signing and no credential. The SDK is a toolchain, not
      # a secret.
      - name: Kotlin money boundary
        run: ./gradlew :android:testDebugUnitTest --no-daemon

      # Steps 12-15, added 2026-10-22. The Kotlin quality toolchain.
      #
      # **Why these are here rather than only at the release gate.** The
      # gates in release-gates.gradle.kts are this project's strongest
      # checks and they run on `bundleRelease` — so until today a
      # `TelephonyManager` call could sit on `main` through every pull
      # request and be found on the build that was about to ship. These
      # four run per push, so a violation fails on the commit that
      # introduces it.
      #
      # Ordered cheapest-first, matching the Makefile's own principle: a
      # formatting failure should not wait behind a lint run.

      # Step 12. Formatting. ktlint via spotless, covering Kotlin, the
      # Gradle files and the XML — `strings.xml` carries the Bangla bundle.
      - name: Kotlin format
        run: ./gradlew :android:spotlessCheck --no-daemon

      # Step 13. Static analysis, as the money-type backstop.
      - name: Kotlin static analysis
        run: ./gradlew :android:detekt --no-daemon

      # Step 14. Android Lint, where HardwareIds is fatal. This is the
      # per-commit complement to the release DEX scan: Lint reads OUR
      # source and catches an identifier read as it is written; the DEX
      # scan reads the shipped bytecode and catches one that arrived
      # inside a dependency. Both are needed and they catch different
      # things.
      - name: Android Lint
        run: ./gradlew :android:lintDebug --no-daemon

      # Step 15. The coverage ratchet. No percentage target — the affirmed
      # practice is explicit that gating this surface on a number produces
      # tests written to raise the number. What is enforced is that the
      # figure does not DROP, now that three Android Bolts have merged.
      - name: Kotlin coverage ratchet
        run: ./gradlew :android:verifyCoverageRatchet --no-daemon

      - name: Upload lint and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            android/build/reports/lint-results-debug.html
            android/build/reports/detekt/
            android/build/reports/jacoco/
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-results
          path: android/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
