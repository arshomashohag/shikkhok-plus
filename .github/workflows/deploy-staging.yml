name: deploy-staging

# **Separate from `check.yml`, and the separation is the point.** The
# per-push gate runs on a fresh clone with NO credential, which is what
# makes it reproducible locally — `team.md` records that as load-bearing,
# because a gate reproducible only by pushing is a gate that gets
# bypassed. Putting SMS credentials in that workflow would end it.
#
# This workflow carries the credentials, runs on demand, and never gates
# a pull request.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or tag to deploy"
        required: false
        type: string
        default: main
      run_migrations:
        description: "Apply Alembic migrations as part of this deploy"
        required: false
        type: boolean
        default: true

# **No typed confirmation.** The `staging` environment below already
# gates this on an approval, and a second ceremony guarding the same
# door teaches people to type the word without reading the sentence.
# The inputs above ask something USEFUL instead: what to deploy, and
# whether the schema changes.

permissions:
  contents: read
  # For the OIDC token used to push to ECR and run the SSM
  # delivery. No long-lived AWS key exists anywhere.
  id-token: write

env:
  # Referenced by configure-aws-credentials below. Must match the
  # region terraform.yml applies to, or the deploy resolves an
  # instance and a repository that do not exist.
  AWS_REGION: us-east-1

concurrency:
  # One deploy at a time. Two overlapping runs would race the migration
  # step against each other, and Alembic is not a locking mechanism.
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          # The dispatched ref, so a hotfix branch can be deployed
          # without merging it first.
          ref: ${{ inputs.ref || github.ref }}

      - name: What this run will do
        run: |
          {
            echo "### Deploying"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| ref | \`${{ inputs.ref || github.ref_name }}\` |"
            echo "| commit | \`${GITHUB_SHA:0:12}\` |"
            echo "| migrations | ${{ inputs.run_migrations }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The secrets are REQUIRED here, and checked before anything runs.
      # A deploy that starts, migrates, and then discovers it has no SMS
      # key has already changed the schema.
      - name: Verify the required configuration is present
        env:
          SMS_API_KEY: ${{ secrets.SHIKKHOKPLUS_SMS_API_KEY }}
          SMS_SENDER_ID: ${{ secrets.SHIKKHOKPLUS_SMS_SENDER_ID }}
          OTP_HMAC_KEY: ${{ secrets.SHIKKHOKPLUS_OTP_HMAC_KEY }}
          JWT_KEYS: ${{ secrets.SHIKKHOKPLUS_JWT_KEYS }}
          SMS_BASE_URL: ${{ vars.SHIKKHOKPLUS_SMS_BASE_URL }}
          SMS_APP_HASH: ${{ vars.SHIKKHOKPLUS_SMS_APP_HASH }}
        run: |
          missing=()
          [ -n "$SMS_API_KEY" ]   || missing+=("secret SHIKKHOKPLUS_SMS_API_KEY")
          [ -n "$SMS_SENDER_ID" ] || missing+=("secret SHIKKHOKPLUS_SMS_SENDER_ID")
          [ -n "$OTP_HMAC_KEY" ]  || missing+=("secret SHIKKHOKPLUS_OTP_HMAC_KEY")
          [ -n "$JWT_KEYS" ]      || missing+=("secret SHIKKHOKPLUS_JWT_KEYS")
          [ -n "$SMS_BASE_URL" ]  || missing+=("variable SHIKKHOKPLUS_SMS_BASE_URL")
          [ -n "$SMS_APP_HASH" ]  || missing+=("variable SHIKKHOKPLUS_SMS_APP_HASH")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Not configured: ${missing[*]}"
            echo "Set secrets and variables under Settings -> Environments -> staging."
            exit 1
          fi

          # https is enforced in the adapter too, but failing HERE names
          # the problem. Plain http serves the same API with no redirect
          # and no HSTS, so a misconfigured URL ships the phone number
          # and the OTP in cleartext and succeeds silently.
          case "$SMS_BASE_URL" in
            https://*) ;;
            *) echo "::error::SHIKKHOKPLUS_SMS_BASE_URL must be https, got '$SMS_BASE_URL'"
               exit 1 ;;
          esac

          # The SMS Retriever hash is exactly 11 characters. A wrong one
          # renders a valid SMS that never triggers autofill, and nothing
          # reports it.
          if [ "${#SMS_APP_HASH}" -ne 11 ]; then
            echo "::error::SHIKKHOKPLUS_SMS_APP_HASH must be 11 characters, got ${#SMS_APP_HASH}"
            exit 1
          fi

          echo "Configuration present."

      - name: Write the environment file
        env:
          SMS_API_KEY: ${{ secrets.SHIKKHOKPLUS_SMS_API_KEY }}
          SMS_SENDER_ID: ${{ secrets.SHIKKHOKPLUS_SMS_SENDER_ID }}
          OTP_HMAC_KEY: ${{ secrets.SHIKKHOKPLUS_OTP_HMAC_KEY }}
          JWT_KEYS: ${{ secrets.SHIKKHOKPLUS_JWT_KEYS }}
          DB_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          SMS_BASE_URL: ${{ vars.SHIKKHOKPLUS_SMS_BASE_URL }}
          SMS_APP_HASH: ${{ vars.SHIKKHOKPLUS_SMS_APP_HASH }}
          DAILY_SMS: ${{ vars.SHIKKHOKPLUS_GLOBAL_DAILY_SMS }}
          STAGING_OUTBOX: ${{ vars.SHIKKHOKPLUS_STAGING_OUTBOX }}
        run: |
          # Written with restrictive permissions BEFORE any value goes
          # in, so the file is never briefly world-readable.
          umask 077
          {
            echo "SHIKKHOKPLUS_ENVIRONMENT=staging"
            echo "POSTGRES_PASSWORD=${DB_PASSWORD}"
            echo "SHIKKHOKPLUS_OTP_HMAC_KEY=${OTP_HMAC_KEY}"
            echo "SHIKKHOKPLUS_JWT_KEYS=${JWT_KEYS}"
            echo "SHIKKHOKPLUS_JWT_ACTIVE_KID=k1"
            echo "SHIKKHOKPLUS_SMS_APP_HASH=${SMS_APP_HASH}"
            echo "SHIKKHOKPLUS_GLOBAL_DAILY_SMS=${DAILY_SMS:-50}"
            echo "SHIKKHOKPLUS_SMS_ADAPTER=bulksmsbd"
            echo "SHIKKHOKPLUS_SMS_BASE_URL=${SMS_BASE_URL}"
            echo "SHIKKHOKPLUS_SMS_API_KEY=${SMS_API_KEY}"
            echo "SHIKKHOKPLUS_SMS_SENDER_ID=${SMS_SENDER_ID}"
            # **The staging outbox, off by default.** It exposes the
            # most recent OTP for a number to an UNAUTHENTICATED
            # caller, so anyone who can reach the API can sign in as
            # anyone. That is acceptable only while there is no real
            # user and no real data.
            #
            # Set the SHIKKHOKPLUS_STAGING_OUTBOX variable to 1 to
            # turn it on -- which is what lets the Android app sign
            # in before the SMS gateway credentials are live. Turn it
            # back off the moment real codes arrive: a production
            # process with this set refuses to start, and staging has
            # no such guard.
            echo "SHIKKHOKPLUS_STAGING_OUTBOX=${STAGING_OUTBOX:-0}"
          } > .env

      # **QEMU, because the runner is x86 and the host is arm64.**
      # Without this, `docker build --platform linux/arm64` pulls the
      # arm64 base image and then tries to execute /bin/sh from it
      # natively -- which fails with `exec format error` on the first
      # RUN, naming neither the platform nor the cause.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-staging-${{ github.run_id }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Resolve the target host and repository
        id: target
        run: |
          # Read from Terraform's own outputs rather than a variable
          # somebody has to keep in step. A hardcoded instance id
          # silently targets a destroyed host after a rebuild.
          repo=$(aws ecr describe-repositories \
            --repository-names "shikkhokplus-${{ vars.TF_ENVIRONMENT || 'staging' }}-backend" \
            --query 'repositories[0].repositoryUri' --output text)

          instance=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=shikkhokplus-${{ vars.TF_ENVIRONMENT || 'staging' }}-app" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)

          if [ -z "$instance" ] || [ "$instance" = "None" ]; then
            echo "::error::No running app instance found. Has terraform applied?"
            exit 1
          fi

          echo "repository=$repo"   >> "$GITHUB_OUTPUT"
          echo "instance=$instance" >> "$GITHUB_OUTPUT"
          echo "Repository: $repo"
          echo "Instance:   $instance"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          # The commit SHA, never `latest` [team.md Deployment]. The
          # repository is IMMUTABLE, so this tag is the artifact and a
          # rollback is a redeploy rather than a rebuild.
          tags: ${{ steps.target.outputs.repository }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # **Delivered over SSM, because there is no inbound port 22.**
      # The commands run as root on the host; the compose project runs
      # as ubuntu.
      - name: Deliver to the host
        id: deliver
        env:
          INSTANCE: ${{ steps.target.outputs.instance }}
          IMAGE: ${{ steps.target.outputs.repository }}:${{ github.sha }}
          RUN_MIGRATIONS: ${{ inputs.run_migrations }}
        run: |
          # The compose file and the env file are sent as base64, so
          # no secret value ever appears in an SSM command document --
          # those are readable in the console and retained for 30
          # days.
          compose_b64=$(base64 -w0 deploy/docker-compose.staging.yml)
          env_b64=$(base64 -w0 .env)

          cmd=$(aws ssm send-command \
            --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA:0:12}" \
            --parameters "commands=[
              \"set -euo pipefail\",
              \"cd /srv/shikkhokplus\",
              \"echo '$compose_b64' | base64 -d > docker-compose.yml\",
              \"umask 077; echo '$env_b64' | base64 -d > .env\",
              \"echo 'API_IMAGE=$IMAGE' >> .env\",
              \"chown ubuntu:ubuntu docker-compose.yml .env\",
              \"sudo -u ubuntu docker compose pull\",
              \"sudo -u ubuntu docker compose up -d --remove-orphans\",
              \"$([ \"$RUN_MIGRATIONS\" = true ] && echo 'sudo -u ubuntu docker compose run --rm api alembic upgrade head' || echo 'echo skipping migrations')\",
              \"sudo -u ubuntu docker compose ps\"
            ]" \
            --query 'Command.CommandId' --output text)

          echo "Command: $cmd"

          # Poll rather than sleep: a fixed sleep either wastes time
          # or reports a result that has not happened yet.
          for _ in $(seq 1 60); do
            status=$(aws ssm get-command-invocation \
              --command-id "$cmd" --instance-id "$INSTANCE" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$cmd" \
            --instance-id "$INSTANCE" \
            --query 'StandardOutputContent' --output text || true
          aws ssm get-command-invocation --command-id "$cmd" \
            --instance-id "$INSTANCE" \
            --query 'StandardErrorContent' --output text || true

          [ "$status" = "Success" ] || {
            echo "::error::Delivery failed with status $status"
            exit 1
          }

      # **The deploy is not done until the API answers.** A container
      # that starts and then exits reports a successful `up -d`, so
      # this asserts the outcome rather than the command.
      - name: The API responds
        env:
          INSTANCE: ${{ steps.target.outputs.instance }}
        run: |
          cmd=$(aws ssm send-command --instance-ids "$INSTANCE" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["sleep 5","curl -fsS -m 10 http://127.0.0.1:8000/health || (echo UNHEALTHY; docker logs --tail 50 $(docker ps -aqf name=api) 2>&1; exit 1)"]' \
            --query 'Command.CommandId' --output text)

          for _ in $(seq 1 24); do
            status=$(aws ssm get-command-invocation --command-id "$cmd" \
              --instance-id "$INSTANCE" --query Status --output text \
              2>/dev/null || echo Pending)
            case "$status" in Success|Failed|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$cmd" \
            --instance-id "$INSTANCE" --query 'StandardOutputContent' \
            --output text || true

          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$cmd" \
              --instance-id "$INSTANCE" --query 'StandardErrorContent' \
              --output text || true
            echo "::error::The API did not become healthy."
            exit 1
          fi

          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${{ steps.target.outputs.repository }}:${{ github.sha }}\` |"
            echo "| instance | \`${{ steps.target.outputs.instance }}\` |"
            echo "| migrations | ${{ inputs.run_migrations }} |"
            echo "| health | passing |"
          } >> "$GITHUB_STEP_SUMMARY"
