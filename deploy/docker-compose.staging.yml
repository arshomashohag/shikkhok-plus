# The app host's compose file.
#
# **No `db` service.** Postgres is RDS, outside the instance, which is
# what lets the deploy pipeline refresh the ASG on every run: the
# instance is cattle, the database is not. A containerised Postgres
# here would live on a root volume with delete_on_termination = true,
# so every deploy would silently reset the database to empty.
#
# Uploaded by Terraform to the host's config bucket and fetched at
# boot (it no longer fits in user_data). A replaced instance therefore
# has it before any deploy has touched that machine.
#
# **Two services, two database identities** [OPS-5]. `api` -- and
# every scheduled job, which runs as `docker compose run --rm api` --
# connects as the restricted `shikkhok_app` role. `migrate` is the only
# service that ever sees the owner's URL, and it runs only when the
# boot script names it: for `alembic upgrade head`, then once to set
# shikkhok_app's password.

name: shikkhokplus

# Settings both services share. A YAML anchor rather than a second
# copy, so a variable added to one cannot be forgotten in the other.
#
# **No fallback for the environment name, the app hash or the SMS
# ceiling** [C-19]. Each used to default here (`staging`, the
# placeholder hash, 50), so a runtime env missing them started a process
# that passed its own startup checks with values nobody chose -- and a
# missing name made a production host call itself staging. The deploy
# writes all three for every environment; their absence now stops the
# container instead.
x-app-environment: &app-environment
  SHIKKHOKPLUS_ENVIRONMENT: ${SHIKKHOKPLUS_ENVIRONMENT:?SHIKKHOKPLUS_ENVIRONMENT is required}
  SHIKKHOKPLUS_OTP_HMAC_KEY: ${SHIKKHOKPLUS_OTP_HMAC_KEY:?required}
  SHIKKHOKPLUS_JWT_KEYS: ${SHIKKHOKPLUS_JWT_KEYS:?required}
  SHIKKHOKPLUS_JWT_ACTIVE_KID: ${SHIKKHOKPLUS_JWT_ACTIVE_KID:-k1}
  SHIKKHOKPLUS_SMS_APP_HASH: ${SHIKKHOKPLUS_SMS_APP_HASH:?SHIKKHOKPLUS_SMS_APP_HASH is required}
  SHIKKHOKPLUS_GLOBAL_DAILY_SMS: ${SHIKKHOKPLUS_GLOBAL_DAILY_SMS:?SHIKKHOKPLUS_GLOBAL_DAILY_SMS is required}
  SHIKKHOKPLUS_GLOBAL_DAILY_SIGNUP_SMS: ${SHIKKHOKPLUS_GLOBAL_DAILY_SIGNUP_SMS:-100}
  SHIKKHOKPLUS_GLOBAL_HOURLY_VERIFY_FAILURES: ${SHIKKHOKPLUS_GLOBAL_HOURLY_VERIFY_FAILURES:-300}
  SHIKKHOKPLUS_SMS_API_KEY: ${SHIKKHOKPLUS_SMS_API_KEY:-}
  SHIKKHOKPLUS_SMS_SENDER_ID: ${SHIKKHOKPLUS_SMS_SENDER_ID:-}
  SHIKKHOKPLUS_SMS_ADAPTER: ${SHIKKHOKPLUS_SMS_ADAPTER:-null}
  SHIKKHOKPLUS_SMS_BASE_URL: ${SHIKKHOKPLUS_SMS_BASE_URL:-}
  SHIKKHOKPLUS_STAGING_OUTBOX: ${SHIKKHOKPLUS_STAGING_OUTBOX:-0}
  # The operator numbers the outbox may serve. Required on staging for
  # the outbox to exist at all (app/gateway/outbox.py).
  SHIKKHOKPLUS_STAGING_OUTBOX_NUMBERS: ${SHIKKHOKPLUS_STAGING_OUTBOX_NUMBERS:-}
  # nginx always overwrites this header from CloudFront's
  # CloudFront-Viewer-Address, so it is the only client address the
  # application may trust for the per-IP OTP ceiling. uvicorn trusts no
  # forwarded header at all.
  SHIKKHOKPLUS_TRUSTED_CLIENT_IP_HEADER: X-Client-Address
  # **The MFA keyring and the admin surface's locks.** The deploy writes
  # all five into the runtime env, but compose hands a container only
  # what is listed here, so for as long as they were missing every
  # authenticator enrollment raised MfaKeyError and every admin route
  # answered 403. tests/gates/test_compose_forwards_runtime_env.py now
  # fails when the deploy writes a variable this block does not forward.
  #
  # No `:?` on any of them: the deploy writes them empty when the
  # GitHub secret is unset, and the production startup check
  # (app/config.py) is what reports a missing keyring, with a reason.
  SHIKKHOKPLUS_MFA_KEYS: ${SHIKKHOKPLUS_MFA_KEYS:-}
  SHIKKHOKPLUS_MFA_ACTIVE_KID: ${SHIKKHOKPLUS_MFA_ACTIVE_KID:-k1}
  SHIKKHOKPLUS_PLATFORM_ADMIN_PHONES: ${SHIKKHOKPLUS_PLATFORM_ADMIN_PHONES:-}
  SHIKKHOKPLUS_ADMIN_EDGE_SECRET: ${SHIKKHOKPLUS_ADMIN_EDGE_SECRET:-}
  SHIKKHOKPLUS_ADMIN_ALLOWED_CIDRS: ${SHIKKHOKPLUS_ADMIN_ALLOWED_CIDRS:-}
  # **One-time codes by email** (infra/modules/email): the SES SMTP
  # interface with the sender user's credentials, which the deploy reads
  # from SSM. No `:?` here either: a missing value is reported by the
  # application's own startup check, with a reason, not by compose.
  SHIKKHOKPLUS_EMAIL_ADAPTER: ${SHIKKHOKPLUS_EMAIL_ADAPTER:-}
  SHIKKHOKPLUS_SES_SMTP_HOST: ${SHIKKHOKPLUS_SES_SMTP_HOST:-}
  SHIKKHOKPLUS_SES_SMTP_PORT: ${SHIKKHOKPLUS_SES_SMTP_PORT:-}
  SHIKKHOKPLUS_SES_SMTP_USERNAME: ${SHIKKHOKPLUS_SES_SMTP_USERNAME:-}
  SHIKKHOKPLUS_SES_SMTP_PASSWORD: ${SHIKKHOKPLUS_SES_SMTP_PASSWORD:-}
  SHIKKHOKPLUS_EMAIL_FROM: ${SHIKKHOKPLUS_EMAIL_FROM:-}
  SHIKKHOKPLUS_SES_CONFIGURATION_SET: ${SHIKKHOKPLUS_SES_CONFIGURATION_SET:-}
  SHIKKHOKPLUS_GLOBAL_DAILY_EMAIL: ${SHIKKHOKPLUS_GLOBAL_DAILY_EMAIL:-}
  # The public site's origin, for the link in the code email and the
  # public hub's canonical, hreflang and sitemap links. Empty leaves the
  # email link out; it never stops a code being sent.
  SHIKKHOKPLUS_SITE_URL: ${SHIKKHOKPLUS_SITE_URL:-}
  # The hub reviews switch, written by the deploy from SSM `hub-reviews`.
  # Off unless exactly "on"; the application reads it at each call.
  SHIKKHOKPLUS_HUB_REVIEWS: ${SHIKKHOKPLUS_HUB_REVIEWS:-off}
  # The hub join-requests switch, written by the deploy from SSM
  # `hub-enquiries`. Off unless exactly "on"; read at each call.
  SHIKKHOKPLUS_HUB_ENQUIRIES: ${SHIKKHOKPLUS_HUB_ENQUIRIES:-off}
  # The web app's origin: each public hub page's "Report this page" link
  # opens {origin}/ui/hub-report. The deploy refuses to record a release
  # without it.
  SHIKKHOKPLUS_WEB_APP_URL: ${SHIKKHOKPLUS_WEB_APP_URL:-}
  # The hub photo bucket and its region, both written by the deploy from
  # SSM (modules/media). Empty bucket: uploads answer a transient error and
  # deletes wait in the outbox, failing, so the drain's heartbeat goes stale
  # [R9] -- the rest of the API is unaffected.
  # Here rather than on `api` alone so `migrate` sees the same runtime env;
  # only `api` holds credentials to use them with (below).
  SHIKKHOKPLUS_MEDIA_BUCKET: ${SHIKKHOKPLUS_MEDIA_BUCKET:-}
  AWS_REGION: ${AWS_REGION:-}
  # **The SDK never falls back to IMDS.** With the credentials file
  # missing (before the host job's first success, or on the rehearsal
  # host) boto3 would otherwise try the instance metadata service, which
  # hop limit 1 makes time out rather than refuse; this makes it fail at
  # once with "no credentials" instead. Fixed, not from the runtime env.
  AWS_EC2_METADATA_DISABLED: "true"

# **Every container ships its output to CloudWatch** [OPS-11] -- the
# API, the migrate runs and each scheduled job (`run --rm api` inherits
# this). dockerd sends it with the instance role; no container needs,
# or can reach, AWS credentials. `non-blocking` so a slow CloudWatch
# can never stall a request on a log write; Docker's dual logging keeps
# `docker compose logs` and the cron jobs' local log files working.
x-logging: &logging
  driver: awslogs
  options:
    awslogs-group: ${SHIKKHOKPLUS_LOG_GROUP:?SHIKKHOKPLUS_LOG_GROUP is required}
    awslogs-region: ${SHIKKHOKPLUS_LOG_REGION:?SHIKKHOKPLUS_LOG_REGION is required}
    tag: "{{.Name}}-{{.ID}}"
    mode: non-blocking
    max-buffer-size: 4m

services:
  api:
    # **Pulled, never built.** The tag is a commit SHA written into
    # .env by the deploy. A host-side build would run a different
    # build from the one CI tested, on a 2GB box, during a deploy.
    image: ${API_IMAGE:?API_IMAGE is required}

    environment:
      <<: *app-environment
      # The restricted role [OPS-5]. Never the owner.
      SHIKKHOKPLUS_DATABASE_URL: ${SHIKKHOKPLUS_DATABASE_URL:?required}
      # **The photo bucket's credentials, and no other AWS credentials**
      # [H3 deviation 1]. The host's shikkhokplus-media-creds job assumes
      # the media role every 15 minutes and writes its one-hour
      # credentials here (infra/modules/app/user_data.sh.tftpl). The
      # container still cannot reach the instance role: IMDS hop limit 1.
      AWS_SHARED_CREDENTIALS_FILE: /run/media-creds/credentials

    # Read-only: the container can read the credentials, never replace
    # them. The directory exists from boot even when no file has been
    # written yet. `run --rm api` jobs inherit it.
    volumes:
      - /srv/shikkhokplus/media-creds:/run/media-creds:ro

    ports:
      # **Bound to localhost.** nginx is the only thing that talks to
      # it. Without the 127.0.0.1 prefix Docker publishes on 0.0.0.0
      # and writes its own iptables rules ahead of the host firewall,
      # so the API would be reachable on the public IP at :8000 --
      # bypassing nginx and therefore the CloudFront origin-secret
      # check entirely.
      - "127.0.0.1:8000:8000"

    logging: *logging
    restart: unless-stopped

  # **The owner, for schema changes only.** In a profile, so `up` never
  # starts it. The two owner-only values are interpolated from the
  # environment of the shell that runs it -- the boot script exports
  # them from SSM for exactly two commands -- and default to empty, so
  # a run without them fails at connect rather than falling back to
  # anything.
  #
  # SHIKKHOKPLUS_DATABASE_URL is ALSO the owner here, deliberately, so
  # this service has one identity whichever variable a command reads:
  # an alembic run that fell back to the restricted role would fail
  # partway through DDL rather than at connect.
  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}
    profiles: ["migrate"]
    environment:
      <<: *app-environment
      SHIKKHOKPLUS_MIGRATION_DATABASE_URL: ${SHIKKHOKPLUS_MIGRATION_DATABASE_URL:-}
      SHIKKHOKPLUS_DATABASE_URL: ${SHIKKHOKPLUS_MIGRATION_DATABASE_URL:-}
      SHIKKHOKPLUS_APP_DB_PASSWORD: ${SHIKKHOKPLUS_APP_DB_PASSWORD:-}
    logging: *logging
    restart: "no"
