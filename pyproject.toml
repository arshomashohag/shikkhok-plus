[project]
name = "shikkhokplus"
version = "0.1.0"
description = "Private tuition management for Bangladesh — backend"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    # The ASGI server. Absent until B5a because nothing had ever RUN the
    # app -- every test drove it through TestClient, which is exactly why
    # the device leg stayed unverified for two Bolts.
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
    # B3 brings the first integration suite. A real PostgreSQL 16 container,
    # never SQLite: row-level security, NUMERIC(12,2) and ON CONFLICT DO
    # NOTHING are the behaviours under test and SQLite emulates none of them.
    "testcontainers[postgres]>=4.8",
    # The lockfile toolchain, added 2026-10-22. `uv` is what team.md names
    # first and pip-tools is the parenthetical it already allows; pip-tools
    # is taken because it needs no new runtime on the machine or in CI, and
    # `pip install --require-hashes` is the control either way.
    #
    # Declared as a dependency rather than assumed present: `make lock` and
    # the CI currency check both invoke it, and a tool a gate depends on
    # that nobody declares is the gate's own supply-chain hole.
    "pip-tools>=7.4",
    # The CVE scanner. Annotating per push, blocking at the release gate.
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff — formatter and linter.
#
# Line length is 88, a deliberate project-level departure from the 79 in the
# global Python standard. 88 is Ruff's default, so the formatter runs
# unconfigured on the one setting most likely to be mis-set, and the choice is
# made at project setup because changing it later reformats every file.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # baseline
    "I",             # import order (replaces isort)
    "UP",            # pyupgrade — keeps 3.12 idiom
    "B",             # bugbear — mutable default args in FastAPI signatures
    "ASYNC",         # a sync DB call inside async def serializes the loop
    "S",             # bandit subset — this is our SAST tool
    "DTZ",           # naive datetimes
    "BLE",           # bare except Exception
    "D",             # docstrings, Sphinx-style
    "RUF",
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests: `assert` is the point of one (S101), and a docstring is required
# only where the test's intent is not evident from its name — the named-test
# manifest carries the acceptance criterion, so a restated name in a
# docstring would be two things to keep in step. D205/D200 relax the
# summary-line shape for the explanatory docstrings the money tests do carry.
# B015 permits a bare comparison inside `pytest.raises`, which is exactly how
# an operator's refusal is provoked.
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "D205", "D200", "B015"]
# An FCM registration token is NOT a credential and S106's heuristic
# matches it on the name alone. It is a per-install address for a
# delivery channel -- system-rotated, revocable, and naming no hardware,
# which is exactly why the adapter is permitted at all on a
# Families-track app [NFR11.2]. Scoped to the one file that passes
# literal tokens to the adapter under test rather than to tests/**,
# so a genuine hardcoded secret elsewhere in the suite still fails.
"tests/notifications/test_fcm.py" = ["S106"]
# B008 forbids a call in a default argument, and `Depends(...)` in a
# signature IS FastAPI's documented dependency syntax. The app's own
# routes use `Annotated[T, Depends(f)]` and need no exemption; these
# are throwaway violation-fixture apps, built inside a test function to
# prove the gate can fire, where the Annotated form adds noise around
# the three lines that matter.
"tests/contract/test_collection_number.py" = ["B008"]
# Deliberately empty: the money module takes NO rule exemptions. Its
# permission to import `decimal` comes from being the module the ban carves
# out, not from an ignore — asserted by test_gate2_config_scope.
"app/money/**" = []

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ---------------------------------------------------------------------------
# GATE 2 (inward) — NFR9.5, BR6.2.
#
# The load-bearing half of the money boundary. Money arithmetic outside
# app/money needs either a raw Decimal or a float; the float is already
# forbidden project-wide, so banning the Decimal import closes both doors.
#
# app/money/** is re-permitted below. That exception must resolve to exactly
# this path and never a parent — asserted by test_gate2_config_scope
# (NFR9.29).
# ---------------------------------------------------------------------------
"decimal".msg = "Raw decimal arithmetic is confined to app.money (BR6.2, NFR9.5). Use app.money.Money."
"decimal.Decimal".msg = "Raw decimal arithmetic is confined to app.money (BR6.2, NFR9.5). Use app.money.Money."

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# mypy — global baseline plus strict islands.
#
# The global baseline is what makes partial strictness coherent: strictness is
# mostly a property of what a module can SEE, so strict-on-money while it
# imports unchecked code yields either silenced errors or Any flowing in.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.money.*"
strict = true
disallow_any_explicit = true

# ---------------------------------------------------------------------------
# NFR14.11 — the second strict island, added at B2.
#
# team.md names three strict islands: app.money.*, app.authz.* and
# app.schemas.*. B1 configured only the first, correctly — an override
# naming a module that does not exist is dead configuration — which left
# app.schemas with no owning Bolt until U2 populated it.
#
# disallow_any_explicit earns its place here specifically: a response field
# typed Any carries a profile value at runtime while declaring nothing in
# the generated document, which is a hole straight through the schema-wide
# privacy assertion.
#
# app.authz.* stays unconfigured until U3 creates its resolvers, on B1's
# same reasoning.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = "app.schemas.*"
strict = true
# disallow_any_explicit is deliberately NOT set here, and the reason is
# third-party rather than a concession.
#
# Pydantic's BaseModel is generic over Any, so EVERY `class X(BaseModel)`
# statement reports explicit-any regardless of how the model is written --
# verified against a bare three-line subclass. Setting the flag would
# therefore produce one unavoidable error per schema, whose only remedy is
# a per-line `# type: ignore`, and a file dense with ignores is strictly
# worse than the flag being off: the ignores silence real findings too.
#
# WHAT IS AND IS NOT COMPENSATED, stated precisely because an earlier
# version of this comment overstated it and a review caught that.
#
# `strict = true` still applies in full: every function here is annotated
# and no IMPLICIT Any flows through. That is the bulk of the value.
#
# The residual gap is an EXPLICIT `Any` on a response field. The privacy
# gate catches such a field only when its NAME is in a forbidden set and
# its route is teacher-facing -- it matches names, not unconstrained
# schemas generically. An `Any` field with an innocuous name is not
# reported by anything, and a reviewer reading a response model is the
# only thing standing in front of it.
#
# That is a real and accepted gap, not a covered one. It is accepted
# because the alternative -- a `# type: ignore` on every model in the
# package -- silences findings that are not hypothetical, and because an
# `Any` in a response model is visible in a diff in a way an unnoticed
# ignore comment is not.

# ---------------------------------------------------------------------------
# The third strict island, added 2026-10-22.
#
# **This is the override the two comments above were waiting for.** B1 and
# B2 each deferred app.authz.* on the same correct reasoning -- an override
# naming a module that does not exist is dead configuration -- and U3 then
# shipped the resolvers without anyone adding it. Three Units later the
# island was still a declaration in team.md with no configuration behind it,
# which the 2026-10-22 practices reconciliation found.
#
# It earns strictness more than either of the other two. This package
# decides, per request, whether a caller may see a child's data: it computes
# the lens from Owner and Enrollment with no role column [BR1.1], and
# TeacherLens carries the owner_id that scopes every teacher-facing query.
# An implicit Any flowing into that computation is an authorization decision
# made on an unchecked value.
#
# disallow_any_explicit IS set here, unlike app.schemas.*. The Pydantic
# constraint that forced it off there does not apply: this package depends
# on repository PROTOCOLS and the SQLAlchemy session, not on BaseModel, so
# there is no generic-over-Any base class forcing an unavoidable error per
# declaration.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = "app.authz.*"
strict = true
disallow_any_explicit = true

# ---------------------------------------------------------------------------
# The fourth strict island, added at D1.
#
# team.md names three — app.money.*, app.authz.* and app.schemas.* — and
# this is a deliberate addition rather than one of those three arriving
# late. app.accounts is the package that CREATES an identity and the only
# one permitted to write the per-link decision columns, so the two things it
# decides are "does this person exist" and "has this person agreed". An
# implicit Any flowing through either is the same class of defect the
# app.authz island exists to catch, one step earlier in the sequence: by the
# time a lens is resolved, the decision it reads was already written here.
#
# disallow_any_explicit IS set, as on app.authz.*: this package depends on
# the SQLAlchemy session and the ORM models, not on BaseModel, so the
# Pydantic generic-over-Any constraint that forced the flag off for
# app.schemas.* does not apply. The request and response models this
# package's routes use live in app.schemas and are checked there.
#
# Named now rather than deferred because the modules exist now. B1 recorded
# the opposite reasoning for a good reason — an override naming a module
# that does not exist is dead configuration — and the follow-up it implied
# was then missed for a whole Unit, which is the failure this entry avoids
# by being written in the same commit as the package.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = "app.accounts.*"
strict = true
disallow_any_explicit = true

# ---------------------------------------------------------------------------
# The fifth strict island, added at D3.
#
# **This package decides what a family owes.** It computes the charge, the
# carry, the credit application and the shortfall, and it writes the rows
# every balance is folded from. An implicit Any flowing through any of that
# is a money error made on an unchecked value -- the same class of defect
# the app.authz island exists to catch, over the other thing in this product
# that must never be wrong.
#
# It earns the flag for a second reason the other islands do not have: the
# arithmetic itself lives in app.money at 100% branch coverage, so this
# package is almost entirely the GLUE between that module and the database.
# Glue is exactly where an unchecked value crosses a boundary, and the
# boundary here is a Money leaving a NUMERIC(12,2) column.
#
# disallow_any_explicit IS set, as on app.authz.* and app.accounts.*. The
# Pydantic constraint that forced it off for app.schemas.* does not apply:
# this package depends on the session and the ORM models, not on BaseModel,
# and the request and response models its routes use live in app.schemas
# and are checked there.
#
# Named in the same commit as the package, which is the practice B1 and B2
# each recorded correctly and the follow-up that was then missed for a whole
# Unit -- an override naming a module that does not exist is dead
# configuration, and one naming a module that does is overdue the moment the
# module lands.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = "app.fees.*"
strict = true
disallow_any_explicit = true

# ---------------------------------------------------------------------------
# Coverage — NFR9.13, NFR9.31a/b.
#
# 100% BRANCH coverage, scoped by behaviour rather than by path: any module
# importing the money type and branching over money values belongs here.
# No exclude_lines beyond the defaults — an inline pragma is the standard way
# a 100% target is quietly defeated. The one construct that would otherwise be
# unreachable (the exhaustiveness assertion) is written to emit no coverable
# branch, via assert_never under a statically-proven total mapping.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app/money"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
# ---------------------------------------------------------------------------
# THE ONE SANCTIONED EXCLUSION. [NFR9.28]
#
# `assert_never` marks the position an unrecognised ledger kind would reach.
# It is unreachable BECAUSE a stronger check already guarantees it: the match
# in app/money/_ledger.py is total over LedgerEntryKind, and mypy proves that
# exhaustiveness. Adding a kind without extending the fold fails the type
# check, not the coverage run.
#
# This is a configuration entry, not an inline pragma, and the distinction is
# the whole point: a configuration entry is reviewed, enumerable and
# greppable, while a `# pragma: no cover` comment is invisible in a diff
# among the lines it exempts.
#
# Exactly one construct in this module qualifies. A second candidate is a
# design signal — the last unreachable branch here turned out to be a dead
# error class that should not have existed — not a second exclusion.
# ---------------------------------------------------------------------------
exclude_also = [
    "assert_never\\(unreachable\\)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
