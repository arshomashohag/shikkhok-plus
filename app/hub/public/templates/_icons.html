{#- The hub's icons, drawn inline in the text's own colour. Each is
    decoration beside words that say the same thing, so each is hidden
    from assistive technology. Attributes only: no style, which the CSP
    would refuse. -#}
{% macro icon(name, size=18) -%}
<svg class="icon icon-{{ name }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "pin" -%}
<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>
{%- elif name == "clock" -%}
<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "search" -%}
<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
{%- elif name == "next" -%}
<path d="M9 6l6 6-6 6"/>
{%- elif name == "back" -%}
<path d="M15 5l-7 7 7 7"/>
{%- elif name == "shield" -%}
<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "child" -%}
<circle cx="12" cy="7" r="3"/><path d="M6 21v-3a6 6 0 0 1 12 0v3"/><path d="M4 4l16 16"/>
{%- elif name == "sync" -%}
<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
{%- elif name == "check" -%}
<path d="M5 12l5 5 9-10"/>
{%- elif name == "phone" -%}
<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>
{%- elif name == "people" -%}
<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2"/><path d="M16 4a3 3 0 0 1 0 6M21 20v-2a6 6 0 0 0-4-5.6"/>
{%- elif name == "star" -%}
<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/>
{%- elif name == "seat" -%}
<path d="M7 11V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6"/><path d="M5 11h14v4H5z"/><path d="M7 15v6M17 15v6"/>
{%- elif name == "flag" -%}
<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>
{%- endif -%}
</svg>
{%- endmacro %}
